name: Build Grok target
description: Build and stage one complete Grok distribution artifact.

inputs:
  target:
    description: Rust target triple to build and stage.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-ci
    - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      with:
        targets: ${{ inputs.target }}
    - if: runner.os == 'Windows'
      uses: ./.github/actions/setup-msvc-env
      with:
        target: ${{ inputs.target }}
    - if: contains(inputs.target, 'linux')
      name: Use hermetic Cargo home
      shell: bash
      run: |
        set -euo pipefail
        cargo_home="${GITHUB_WORKSPACE}/.cargo-home-${{ inputs.target }}"
        mkdir -p "${cargo_home}/bin"
        : > "${cargo_home}/config.toml"
        echo "CARGO_HOME=${cargo_home}" >> "${GITHUB_ENV}"
        echo "${cargo_home}/bin" >> "${GITHUB_PATH}"
    - if: contains(inputs.target, 'linux')
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: 0.14.0
        use-cache: false
    - if: contains(inputs.target, 'linux')
      name: Install musl tools
      env:
        TARGET: ${{ inputs.target }}
      shell: bash
      run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
    - uses: ./.github/actions/setup-rusty-v8
      with:
        target: ${{ inputs.target }}
    - if: contains(inputs.target, 'linux')
      name: Build Linux sandbox helper
      working-directory: codex-rs
      shell: bash
      run: |
        set -euo pipefail
        export AWS_LC_SYS_NO_JITTER_ENTROPY=1
        cargo build --release --target "${{ inputs.target }}" --bin bwrap
        bwrap="${CARGO_TARGET_DIR:-target}/${{ inputs.target }}/release/bwrap"
        echo "CODEX_BWRAP_SHA256=$(sha256sum "${bwrap}" | awk '{print $1}')" >> "${GITHUB_ENV}"
    - name: Build Grok binaries
      env:
        TARGET: ${{ inputs.target }}
      working-directory: codex-rs
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${TARGET}" == "x86_64-pc-windows-msvc" ]]; then
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
        fi
        if [[ "${TARGET}" == *linux* ]]; then
          export AWS_LC_SYS_NO_JITTER_ENTROPY=1
        fi
        cargo build --release --target "${TARGET}" --bin codex --bin codex-code-mode-host
    - name: Stage Grok distribution
      env:
        TARGET: ${{ inputs.target }}
      working-directory: codex-rs
      shell: bash
      run: |
        set -euo pipefail
        release_dir="${CARGO_TARGET_DIR:-target}/${TARGET}/release"
        output="${RUNNER_TEMP}/dist/${TARGET}"
        bin_dir="${output}/bin"
        mkdir -p "${bin_dir}"
        cp "${GITHUB_WORKSPACE}/grok/dist/config.toml.example" "${output}/config.toml.example"
        cp "${GITHUB_WORKSPACE}/grok/dist/models.json" "${output}/models.json"
        cp "${GITHUB_WORKSPACE}/grok/dist/INSTALL.md" "${output}/INSTALL.md"
        cp "${GITHUB_WORKSPACE}/LICENSE" "${output}/LICENSE"
        if [[ "${TARGET}" == *windows* ]]; then
          cp "${release_dir}/codex.exe" "${bin_dir}/grok-bin.exe"
          cp "${release_dir}/codex-code-mode-host.exe" "${bin_dir}/codex-code-mode-host.exe"
          cp "${GITHUB_WORKSPACE}/grok/dist/grok.ps1" "${bin_dir}/grok.ps1"
        else
          cp "${release_dir}/codex" "${bin_dir}/grok-bin"
          cp "${release_dir}/codex-code-mode-host" "${bin_dir}/codex-code-mode-host"
          cp "${GITHUB_WORKSPACE}/grok/dist/grok" "${bin_dir}/grok"
        fi
        if [[ "${TARGET}" == *linux* ]]; then
          cp "${release_dir}/bwrap" "${bin_dir}/bwrap"
        fi
    - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: grok-${{ github.sha }}-${{ inputs.target }}
        path: ${{ runner.temp }}/dist/${{ inputs.target }}
        if-no-files-found: error
        retention-days: 90
