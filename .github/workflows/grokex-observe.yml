name: grokex-observe

# Non-gating Live observation of the newest published Grokex release. Every
# scenario runs in observation mode: deadlines and semantic failures are
# recorded as evidence instead of failing the run, so the recorded Turn
# durations can inform deadline reviews in grokex/live_contracts.json.
# Observation evidence never satisfies a release contract.
#
# GitHub only evaluates `schedule` on the default branch; from a release branch
# this workflow runs through workflow_dispatch.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published Grokex tag to observe (empty picks the newest published release)
        required: false
        default: ''
        type: string
      scenarios:
        description: Comma-separated scenario ids, or "all"
        required: false
        default: all
        type: string

permissions:
  actions: read
  contents: read

jobs:
  observe:
    name: Observe published release
    uses: ./.github/workflows/grokex-live.yml
    with:
      release_tag: ${{ inputs.release_tag || '' }}
      scenarios: ${{ inputs.scenarios || 'all' }}
      mode: observation
    secrets:
      GROK_CONFIG_TOML: ${{ secrets.GROK_CONFIG_TOML }}

  summarize:
    name: Summarize Turn latency against contract deadlines
    needs: observe
    if: always() && needs.observe.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: grokex-live-evidence-*
          path: evidence
      - name: Summarize observations
        shell: bash
        run: |
          set -euo pipefail
          python3 grokex/release.py summarize-observations --evidence-dir evidence | tee observation-summary.json
          {
            echo "## Observation summary"
            echo
            echo '```json'
            cat observation-summary.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grokex-observation-summary
          path: observation-summary.json
          if-no-files-found: error
          retention-days: 90
