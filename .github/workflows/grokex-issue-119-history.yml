name: Grokex Issue 119 history projection

on:
  pull_request:
    branches:
      - codex/issue-119-history-projection

permissions:
  contents: read

jobs:
  history-projection:
    runs-on: ubuntu-24.04
    env:
      RUST_MIN_STACK: 16777216
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify product parent
        working-directory: .
        env:
          EXPECTED_PRODUCT_SHA: cdb945fca5e4e83c5dbc1e5691442ec45c3b3b65
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_SHA"
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt
      - name: Capture authoritative formatting
        run: |
          cargo fmt -- --config imports_granularity=Item
          git diff --binary -- . > "$RUNNER_TEMP/issue-119.patch"
          git status --short -- . > "$RUNNER_TEMP/issue-119.status"
      - name: Provider projection contracts
        run: cargo test -p codex-model-provider
      - name: Existing request-boundary compatibility contract
        run: cargo test -p codex-core --test all -- suite::client::non_openai_responses_requests_include_item_ids_without_passthrough_metadata --exact
      - name: Affected library lints
        run: cargo clippy -p codex-model-provider -p codex-core --lib -- -D warnings
      - name: Upload formatter authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-119-history-authority
          path: |
            ${{ runner.temp }}/issue-119.patch
            ${{ runner.temp }}/issue-119.status
          if-no-files-found: error
