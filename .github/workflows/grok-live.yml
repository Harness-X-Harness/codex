name: Temporary bounded reasoning profile control
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: temporary-effort-ab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  experiment:
    if: ${{ github.repository == 'Harness-X-Harness/codex' && github.ref == 'refs/heads/diagnostic/grok-effort-ab-20261028' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: experiment-source
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: e3c0812c7d47c567d42a181c921a30aa3c35cdc0
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: harness/grok/go.mod
          cache: false
      - name: Verify the fixed package before backend access
        working-directory: harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = e3c0812c7d47c567d42a181c921a30aa3c35cdc0
          python3 grok/package/fetch_artifact.py --artifact-id 12769806175 \
            --harness-sha e3c0812c7d47c567d42a181c921a30aa3c35cdc0 \
            --expected-line grok/rust-v0.164.0 --output "$RUNNER_TEMP/ab-package"
      - name: Compile temporary driver and verify offline budget and wire difference
        env:
          GOTOOLCHAIN: local
        run: |
          cp experiment-source/grok/diagnostic-effort-ab/driver_test.go harness/grok/live/zz_effort_experiment_test.go
          cd harness/grok
          go test -c -o "$GITHUB_WORKSPACE/experiment-source/grok/diagnostic-effort-ab/driver.test" ./live
          cd "$GITHUB_WORKSPACE/experiment-source/grok/diagnostic-effort-ab"
          python3 -m unittest -v test_relay.py test_controller.py
          python3 run.py --offline --binary "$RUNNER_TEMP/ab-package/package/bin/grok-bin" --output "$RUNNER_TEMP/ab-offline"
      - name: Execute the authorized bounded experiment once
        working-directory: experiment-source/grok/diagnostic-effort-ab
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          python3 run.py --execute --binary "$RUNNER_TEMP/ab-package/package/bin/grok-bin" \
            --offline-proof "$RUNNER_TEMP/ab-offline/proof.json" --output "$RUNNER_TEMP/ab-evidence"
      - name: Retain only allowlisted safe experiment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bounded-effort-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ab-evidence/*.json
            ${{ runner.temp }}/ab-offline/*.json
            ${{ runner.temp }}/ab-package/verified.json
          if-no-files-found: warn
          retention-days: 7
