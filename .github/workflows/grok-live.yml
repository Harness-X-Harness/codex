name: grok-live

# Grok integration diagnostics are independent from release construction.
# Pull requests run the pure-Go harness contracts. A live/grok-<run-id> push
# reuses the existing Linux artifact from that Grok delivery run and never
# builds or publishes release artifacts.
on:
  pull_request:
    branches: ['grok/**']
    paths:
      - 'grok/live/**'
      - '.github/workflows/grok-live.yml'
  push:
    branches: ['live/grok-*']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing Grok workflow run whose Linux artifact is tested
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  contracts:
    name: Live harness contracts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: grok/live/go.mod
          cache: false
      - name: Test the pure-Go harness
        working-directory: grok/live
        env:
          GOWORK: 'off'
        run: go test ./... -count=1

  live:
    name: Grok Live replay
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: source
        name: Resolve source workflow run
        env:
          DISPATCH_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            run_id="${DISPATCH_RUN_ID}"
          else
            prefix='live/grok-'
            [[ "${GITHUB_REF_NAME}" == "${prefix}"* ]]
            run_id="${GITHUB_REF_NAME#"${prefix}"}"
          fi
          [[ "${run_id}" =~ ^[0-9]+$ ]]
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: grok-build-*-x86_64-unknown-linux-musl
          path: archives
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Materialize secret profile
        env:
          GROK_CONFIG_TOML: ${{ secrets.GROK_CONFIG_TOML }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GROK_CONFIG_TOML}" ]]
          umask 077
          printf '%s' "${GROK_CONFIG_TOML}" > "${RUNNER_TEMP}/config.toml"
      - name: Extract the existing Grok binary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives_found < <(find archives -type f -name 'grok-v*-x86_64-unknown-linux-musl.tar.gz' -print)
          [[ "${#archives_found[@]}" -eq 1 ]]
          mkdir -p extracted
          tar -xzf "${archives_found[0]}" -C extracted
          mapfile -t binaries < <(find extracted -type f -path '*/bin/grok-bin' -print)
          [[ "${#binaries[@]}" -eq 1 ]]
          chmod +x "${binaries[0]}"
          echo "GROK_LIVE_CODEX_BIN=${GITHUB_WORKSPACE}/${binaries[0]}" >> "${GITHUB_ENV}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: grok/live/go.mod
          cache: false
      - name: Run Grok Live integration harness
        working-directory: grok/live
        env:
          GROK_LIVE: '1'
          GROK_LIVE_CONFIG: ${{ runner.temp }}/config.toml
          GOWORK: 'off'
        run: go test ./... -count=1 -timeout 30m -run '^TestGrok' -v
