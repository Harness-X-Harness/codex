name: grok

# Proof only. A PR to grok/** is the Codex tree and runs Cargo checks.
# Push builds six targets and runs Go Live on the Linux musl archive.
# Publication is grok/release.py publish, not this workflow.

on:
  pull_request:
    branches: ['grok/**']
  push:
    branches: ['grok/**']

concurrency:
  group: grok-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt -- --config imports_granularity=Item --check

  contracts:
    name: Stock and Grok contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Provider contracts
        run: cargo test -p codex-model-provider -p codex-model-provider-info -p codex-api
      - name: Stock App Server Provider projections
        run: cargo test -p codex-app-server --test all grok
      - name: Shared stock seam controls
        run: |
          set -euo pipefail
          cargo test -p codex-core --lib grok
          cargo test -p codex-core --lib json_whole_number
          cargo test -p codex-guardian-v2 -p codex-memories-write --lib
          cargo test -p codex-app-server --test all mcp_server_tool_call_returns_tool_result
      - name: Grok tools, history, and image generation
        run: |
          set -euo pipefail
          cargo test -p codex-history --lib
          cargo test -p codex-image-generation-extension --lib

  lints:
    name: Affected library lints
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - name: Lint affected libraries
        run: |
          set -euo pipefail
          cargo clippy -p codex-api -p codex-config -p codex-guardian-v2 -p codex-image-generation-extension -p codex-memories-write -p codex-model-provider -p codex-model-provider-info -p codex-tools -p codex-history -p codex-core --lib -- -D warnings
          cargo clippy -p codex-core --test all -- -D warnings
          cargo clippy -p codex-app-server --test all -- -D warnings

  build-linux-x64-musl:
    name: Build x86_64-unknown-linux-musl
    if: github.event_name == 'push'
    needs: [formatting, contracts, lints]
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      ARTIFACT: grok-build-${{ github.sha }}-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/build-grok
        with:
          target: x86_64-unknown-linux-musl
      - name: Package
        env:
          TARGET: x86_64-unknown-linux-musl
        shell: bash
        run: |
          set -euo pipefail
          python3 grok/release.py package \
            --raw-root "${RUNNER_TEMP}/raw" \
            --output "${RUNNER_TEMP}/archive" \
            --repository . \
            --ref "${GITHUB_REF_NAME}" \
            --target "${TARGET}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/archive
          if-no-files-found: error
          retention-days: 90

  build-pack:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    needs: [formatting, contracts, lints]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 170
    env:
      ARTIFACT: grok-build-${{ github.sha }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/build-grok
        with:
          target: ${{ matrix.target }}
      - name: Package
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON}" grok/release.py package \
            --raw-root "${RUNNER_TEMP}/raw" \
            --output "${RUNNER_TEMP}/archive" \
            --repository . \
            --ref "${GITHUB_REF_NAME}" \
            --target "${TARGET}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/archive
          if-no-files-found: error
          retention-days: 90

  live:
    name: Grok Live
    if: github.event_name == 'push'
    needs: [build-linux-x64-musl]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grok-build-${{ github.sha }}-x86_64-unknown-linux-musl
          path: archives
      - name: Materialize secret profile
        env:
          GROK_CONFIG_TOML: ${{ secrets.GROK_CONFIG_TOML }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GROK_CONFIG_TOML}" ]]
          umask 077
          printf '%s' "${GROK_CONFIG_TOML}" > "${RUNNER_TEMP}/config.toml"
      - name: Extract the Grok binary
        run: python3 grok/release.py extract-live --archives archives --output extracted --github-env "${GITHUB_ENV}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: grok/live/go.mod
          cache: false
      - name: Run Grok Live
        working-directory: grok/live
        env:
          GROK_LIVE: "1"
          GROK_LIVE_CONFIG: ${{ runner.temp }}/config.toml
          GOWORK: "off"
        run: go test ./... -count=1 -timeout 30m -run '^TestGrok'
