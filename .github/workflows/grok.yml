name: grok

# One Grok delivery entrypoint. PR runs native checks. Push runs those checks,
# builds six targets once, runs Go Live on that Linux archive, then publishes
# the moving grok-v* channel.

on:
  pull_request:
    branches: ['grok/**']
  push:
    branches: ['grok/**']

concurrency:
  group: grok-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  workflow:
    name: Workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" -shellcheck= -pyflakes= .github/workflows/grok.yml

  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt -- --config imports_granularity=Item --check

  contracts:
    name: Stock and Grok contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Provider contracts
        run: cargo test -p codex-model-provider -p codex-model-provider-info -p codex-api
      - name: Stock App Server Provider projections
        run: cargo test -p codex-app-server --test all grok
      - name: Shared stock seam controls
        run: |
          set -euo pipefail
          cargo test -p codex-core --lib grok
          cargo test -p codex-core --lib review_model_policy
          cargo test -p codex-guardian-v2 -p codex-memories-write --lib
          cargo test -p codex-config --lib grok
          cargo test -p codex-app-server --test all mcp_server_tool_call_returns_tool_result
      - name: Grok metadata-driven V2, Ultra, and hosted X Search
        run: |
          set -euo pipefail
          cargo test -p codex-core --test all grok
          cargo test -p codex-history --lib
          cargo test -p codex-core --lib provider_hosted_custom_tool_call
          cargo test -p codex-image-generation-extension --lib

  lints:
    name: Affected library lints
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - name: Lint affected libraries
        run: |
          set -euo pipefail
          cargo clippy -p codex-api -p codex-config -p codex-guardian-v2 -p codex-image-generation-extension -p codex-memories-write -p codex-model-provider -p codex-model-provider-info -p codex-tools -p codex-history -p codex-core --lib -- -D warnings
          cargo clippy -p codex-core --test all -- -D warnings
          cargo clippy -p codex-app-server --test all -- -D warnings

  identity:
    name: Resolve packaging version
    if: github.event_name == 'push'
    needs: [workflow, formatting, contracts, lints]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
    steps:
      - id: identity
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          prefix="grok/rust-v"
          [[ "${ref}" == "${prefix}"* ]]
          version="${ref#"${prefix}"}"
          [[ -n "${version}" && "${version}" != */* ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=grok-v${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 170
    env:
      ARTIFACT: grok-build-${{ github.sha }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/build-grok
        with:
          target: ${{ matrix.target }}
      - name: Package
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON}" grok/release.py \
            --raw-root "${RUNNER_TEMP}/raw" \
            --output "${RUNNER_TEMP}/archive" \
            --repository . \
            --version "${VERSION}" \
            --target "${TARGET}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/archive
          if-no-files-found: error
          retention-days: 90

  live:
    name: llm-go Grok Live
    if: github.event_name == 'push'
    needs: [identity, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grok-build-${{ github.sha }}-x86_64-unknown-linux-musl
          path: archives
      - name: Materialize secret profile
        env:
          GROK_CONFIG_TOML: ${{ secrets.GROK_CONFIG_TOML }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GROK_CONFIG_TOML}" ]]
          umask 077
          printf '%s' "${GROK_CONFIG_TOML}" > "${RUNNER_TEMP}/config.toml"
      - name: Extract the Grok binary
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          tar -xzf "archives/${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" -C extracted
          test -x "extracted/${RELEASE_TAG}/bin/grok-bin"
          echo "GROKEX_LIVE_CODEX_BIN=${GITHUB_WORKSPACE}/extracted/${RELEASE_TAG}/bin/grok-bin" >> "${GITHUB_ENV}"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ronhuafeng/llm-go
          ref: 9b72c486c516e21a7b1895c412f2203e231c2840
          path: llm-go
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: llm-go/codexsdk/go.mod
          cache-dependency-path: llm-go/codexsdk/go.sum
      - name: Run Go Live
        working-directory: llm-go/codexsdk
        env:
          GROKEX_LIVE: "1"
          GROKEX_LIVE_CONFIG: ${{ runner.temp }}/config.toml
          GOWORK: "off"
        run: go test . -count=1 -timeout 30m -run '^TestGrok'

  publish:
    name: Publish moving channel
    if: github.event_name == 'push'
    needs: [identity, build, live]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
      VERSION: ${{ needs.identity.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: grok-build-${{ github.sha }}-*
          path: archive-download
          merge-multiple: true
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find archive-download -name '*.tar.gz' -type f -exec cp {} release-assets/ \;
          (
            cd release-assets
            sha256sum ./*.tar.gz > SHA256SUMS
          )
          cp grok/dist/config.toml.example grok/dist/install-grok.sh grok/dist/install-grok.ps1 release-assets/
      - name: Replace the moving channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)"
          [[ "${branch_sha}" == "${GITHUB_SHA}" ]]

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          fi

          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Grok ${VERSION}" \
            --notes "Latest GREEN Grok distribution based on stock Codex ${VERSION}."
      - name: Read back the published channel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          [[ "${tag_sha}" == "${GITHUB_SHA}" ]]
          release_target="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish)"
          [[ "${release_target}" == "${GITHUB_SHA}" ]]
