name: grok

on:
  pull_request:
    branches: ["grok/rust-v*", "grok/c7-web-activity-20261008", "grok/c8-package-build-20261009"]
  push:
    branches: ["grok/rust-v*"]

permissions:
  contents: read

# A newer PR head may replace its old proof. Each canonical push retains its run.
concurrency:
  group: grok-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proof:
    name: Native proof
    uses: ./.github/workflows/grok-proof.yml

  cargo:
    name: Cargo
    needs: proof
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require the complete native proof
        env:
          PROOF_RESULT: ${{ needs.proof.result }}
        run: |
          if [[ "$PROOF_RESULT" != "success" ]]; then
            echo "Native proof did not succeed: $PROOF_RESULT" >&2
            exit 1
          fi

  build-linux-x64-musl:
    name: Build x86_64-unknown-linux-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
      artifact-digest: ${{ steps.package.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-grok
        id: package
        with:
          target: x86_64-unknown-linux-musl

  build-macos-arm64:
    name: Build aarch64-apple-darwin
    runs-on: macos-15
    timeout-minutes: 170
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-grok
        with:
          target: aarch64-apple-darwin

  live:
    name: Grok Live (${{ matrix.scenario }})
    needs: build-linux-x64-musl
    if: ${{ !cancelled() && github.event_name == 'push' && github.repository == 'Harness-X-Harness/codex' && startsWith(github.ref, 'refs/heads/grok/rust-v') && vars.GROK_LIVE == '1' && needs.build-linux-x64-musl.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: [basic-primary, basic-pinned, reasoning-primary, reasoning-pinned,
          structured-edit, structured-edit-declined, structured-edit-pinned,
          structured-edit-all, image-primary, image-pinned, shipped-catalog,
          shipped-startup, shipped-pinned, shipped-child, web, web-allowed,
          web-excluded, x, x-window]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Fetch and verify the exact same-run Linux package
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build-linux-x64-musl.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code "$GITHUB_WORKFLOW_SHA" HEAD -- .github/workflows/grok.yml
          python3 grok/package/fetch_artifact.py \
            --run-id "$GITHUB_RUN_ID" --harness-sha "$GITHUB_SHA" \
            --same-run-source-sha "$GITHUB_SHA" --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-artifact-id "$ARTIFACT_ID" --output "$RUNNER_TEMP/live-package"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: grok/go.mod
          cache: false
      - name: Build the identified harness command
        working-directory: grok
        run: go build -o "$RUNNER_TEMP/grok-live" ./cmd/grok-live
      - name: Execute the selected owned scenario once
        env:
          GROK_LIVE: ${{ vars.GROK_LIVE }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/live-evidence"
          cp "$RUNNER_TEMP/live-package/selection.json" "$RUNNER_TEMP/live-evidence/"
          cp "$RUNNER_TEMP/live-package/verified.json" "$RUNNER_TEMP/live-evidence/"
          digest="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/live-package/verified.json"))["runtime_sha256"])')"
          "$RUNNER_TEMP/grok-live" --scenario "$SCENARIO" \
            --binary "$RUNNER_TEMP/live-package/package/bin/grok-bin" --binary-sha256 "$digest" \
            --source-sha "$GITHUB_SHA" --harness-sha "$GITHUB_SHA" \
            --target x86_64-unknown-linux-musl --environment github-actions --timeout 5m \
            > "$RUNNER_TEMP/live-evidence/result.json"
      - name: Retain the bounded scenario result
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grok-live-${{ matrix.scenario }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-evidence
          if-no-files-found: warn
          retention-days: 30

  # Temporary, secret-free discriminator for the exact previously observed package.
  # Remove this job before merging the final fix; it is not native admission proof.
  release-fixture-diagnostic:
    name: Exact release edit diagnostic
    # One authorized control only: the next head after 7b794d8e, first attempt.
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.number == 377 && github.event.before == '7b794d8e1510df4eae1604b32df9e1d08fd1469e' && github.event.pull_request.commits == 4 && github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'grok/c8-release-fixture-20261010' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Fetch and bind the exact historical release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 grok/package/fetch_artifact.py --run-id 37980688233 \
            --harness-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/release-fixture-package"
          mkdir "$RUNNER_TEMP/release-fixture-evidence"
          cp "$RUNNER_TEMP/release-fixture-package/selection.json" "$RUNNER_TEMP/release-fixture-evidence/"
          cp "$RUNNER_TEMP/release-fixture-package/verified.json" "$RUNNER_TEMP/release-fixture-evidence/"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-fixture-package"
          data = json.loads((root / "verified.json").read_text())
          expected = {
              "repository": "Harness-X-Harness/codex",
              "run_id": 37980688233, "run_attempt": 1, "artifact_id": 11643957568,
              "producer_job_id": 113990121553,
              "source_sha": "1ae133a8209a035c6e907f75085776013c0342c3",
              "target": "x86_64-unknown-linux-musl",
              "runtime_sha256": "dc53dcc2da674e8f2108c2d9863f7d332e758c3f6720a1d0fae2fa96b44d0d2f",
              "artifact_digest": "sha256:4f6ef460ae62fdf791e155750672c26be83733c2da967b35106bd266c1198c4f",
          }
          if any(data.get(key) != value for key, value in expected.items()):
              raise SystemExit("Exact release diagnostic subject mismatch")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              print("GROK_LIVE_NATIVE_BIN=" + str(root / "package/bin/grok-bin"), file=env)
              print("GROK_LIVE_NATIVE_SOURCE_SHA=" + data["source_sha"], file=env)
              print("GROK_LIVE_NATIVE_TARGET=" + data["target"], file=env)
          PY
      - name: Read existing namespace settings and helper capabilities
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-fixture-evidence"
          result = {"settings": {}, "helpers": {}}
          for name in ("unprivileged_userns_clone", "apparmor_restrict_unprivileged_userns"):
              path = pathlib.Path("/proc/sys/kernel") / name
              result["settings"][name] = path.read_text().strip() if path.is_file() else None
          candidates = {"system": shutil.which("bwrap"), "bundled": str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-fixture-package/package/codex-resources/bwrap")}
          for kind, value in candidates.items():
              if value is None or not pathlib.Path(value).is_file():
                  result["helpers"][kind] = {"available": False}
                  continue
              path = pathlib.Path(value)
              probe = subprocess.run([str(path), "--help"], capture_output=True, timeout=10)
              help_text = probe.stdout + probe.stderr
              result["helpers"][kind] = {
                  "available": True, "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "help_exit": probe.returncode, "argv0": b"--argv0" in help_text,
                  "perms": b"--perms" in help_text, "as_pid_1": b"--as-pid-1" in help_text,
              }
          encoded = json.dumps(result, sort_keys=True)
          (output / "capabilities.json").write_text(encoded)
          print(encoded)
          PY
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: grok/go.mod
          cache: false
      - name: Exercise the exact release through the existing edit oracle
        working-directory: grok
        env:
          GROK_FACTS: "0"
          GROK_LIVE: "0"
        run: |
          set -euo pipefail
          selected="$(go test ./live -list '^TestNativeStructuredEditFixture$')"
          grep -Fx 'TestNativeStructuredEditFixture' <<< "$selected"
          # One explicitly authorized control on this disposable hosted runner.
          # Restore the original value even when the unchanged oracle fails.
          original_restriction="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          test "$original_restriction" = "1"
          trap 'sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$original_restriction"' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "0"
          go test -count=1 -timeout=4m -v ./live -run '^TestNativeStructuredEditFixture$' \
            | tee "$RUNNER_TEMP/release-fixture-evidence/controlled-fixture.log"
      - name: Preserve the bounded diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-edit-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-fixture-evidence
          if-no-files-found: error
          retention-days: 30
