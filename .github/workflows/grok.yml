name: grok

# PR: proof-domain jobs aggregated by Cargo. Push: merged-PR provenance, complete linux x64 musl + mac arm64 distributions, and Linux Live.
# workflow_dispatch: Live only, using an existing Linux distribution artifact.
# GitHub Actions artifacts are the delivery output; there is no repository publisher.
#
# Every PR to a Grok version line runs Cargo so the check can be required by
# native branch protection. Every push to a Grok version line starts release
# proof for that exact authoritative head; there are no path-based exemptions.
# Everything else uses the native GitHub Actions event/filter semantics.

on:
  pull_request:
    branches: ['grok/rust-v*']
  push:
    branches: ['grok/rust-v*']
  workflow_dispatch:
    inputs:
      binary_run_id:
        description: Existing grok run that already uploaded the Linux distribution artifact
        required: true
        type: string

# PR proof is supersedable by a newer head of the same PR. Push and manual
# release proofs are exact-head evidence and must never cancel one another.
concurrency:
  group: grok-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  release-provenance:
    name: Release provenance
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require merged PR with green Cargo proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          prs="$(gh api             -H 'Accept: application/vnd.github+json'             "/repos/${REPO}/commits/${SHA}/pulls")"

          pr_number="$(jq -r --arg branch "${BRANCH}" '
            [.[] | select(.base.ref == $branch and .merged_at != null)]
            | sort_by(.merged_at)
            | last
            | .number // empty
          ' <<<"${prs}")"

          if [[ -z "${pr_number}" ]]; then
            echo "::error::Release head ${SHA} is not associated with a merged PR into ${BRANCH}."
            exit 1
          fi

          pr="$(gh api "/repos/${REPO}/pulls/${pr_number}")"
          head_sha="$(jq -r '.head.sha' <<<"${pr}")"
          head_ref="$(jq -r '.head.ref' <<<"${pr}")"

          runs="$(gh api             "/repos/${REPO}/actions/workflows/grok.yml/runs?event=pull_request&head_sha=${head_sha}&per_page=100")"

          run_id="$(jq -r --arg head_ref "${head_ref}" '
            [.workflow_runs[]
              | select(
                  .head_branch == $head_ref
                  and .status == "completed"
                  and .conclusion == "success"
                )
            ]
            | sort_by(.created_at)
            | last
            | .id // empty
          ' <<<"${runs}")"

          if [[ -z "${run_id}" ]]; then
            echo "::error::PR #${pr_number} has no successful grok pull_request workflow for head ${head_sha}."
            exit 1
          fi

          jobs="$(gh api "/repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100")"
          cargo_ok="$(jq -r '
            [.jobs[]
              | select(
                  .name == "Cargo"
                  and .status == "completed"
                  and .conclusion == "success"
                )
            ]
            | length
          ' <<<"${jobs}")"

          if [[ "${cargo_ok}" != "1" ]]; then
            echo "::error::PR #${pr_number} workflow run ${run_id} did not complete Cargo successfully."
            exit 1
          fi

          echo "Release provenance OK: PR #${pr_number}, Cargo run ${run_id}."

  live-harness:
    name: Live harness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: grok/live/go.mod
          cache: false
      - name: Live harness unit tests
        working-directory: grok/live
        env:
          GOWORK: "off"
        run: go vet ./... && go test ./... -count=1

  rust-lint:
    name: Rust lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --config imports_granularity=Item --check
      - name: Lint affected libraries
        run: cargo clippy -p codex-api -p codex-config -p codex-guardian-v2 -p codex-image-generation-extension -p codex-memories-write -p codex-model-provider -p codex-model-provider-info -p codex-tools -p codex-history -p codex-core --lib -- -D warnings
      - name: Lint core tests
        run: cargo clippy -p codex-core --test all -- -D warnings
      - name: Lint App Server tests
        run: cargo clippy -p codex-app-server --test all -- -D warnings

  provider-contracts:
    name: Provider contracts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Provider contracts
        run: cargo test -p codex-model-provider -p codex-model-provider-info -p codex-api
      - name: Detect App Server schema closure scope
        id: app_server_schema
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate             "/repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100"             --jq '.[].filename')"
          if grep -Eq '^(codex-rs/app-server-protocol/|codex-rs/protocol/src/|sdk/python/src/openai_codex/generated/)' <<<"${files}"; then
            echo "required=true" >> "${GITHUB_OUTPUT}"
          else
            echo "required=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: App Server schema and precomputed export closure
        if: steps.app_server_schema.outputs.required == 'true'
        run: cargo test -p codex-app-server-protocol --lib
      - name: Stock App Server Provider projections
        run: cargo test -p codex-app-server --test all grok

  core-grok:
    name: Core Grok
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Core Grok lib
        run: cargo test -p codex-core --lib grok
      - name: Core Grok suite
        run: cargo test -p codex-core --test all grok

  structured-edit:
    name: Structured edit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Engine semantics and VerifiedContents failures
        run: cargo test -p codex-apply-patch --lib structured_edit
      - name: Core runtime semantics
        run: cargo test -p codex-core --lib structured_edit
      - name: Lifecycle, stale-snapshot, and integration proof
        run: cargo test -p codex-core --test all structured_edit
      - name: Approval-hook identity
        run: cargo test -p codex-core --test all structured_edit_hooks

  stock-apply-patch:
    name: Stock apply_patch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Stock apply_patch regressions
        run: |
          set -euo pipefail
          cargo test -p codex-apply-patch --lib
          cargo test -p codex-core --lib apply_patch
          cargo test -p codex-core --test all apply_patch -- \
            --skip code_mode_can_apply_patch_via_nested_tool \
            --skip apply_patch_cli_does_not_write_through_symlink_escape_outside_workspace \
            --skip apply_patch_cli_preserves_existing_hard_link_outside_workspace \
            --skip intercepted_apply_patch_verification_uses_local_sandbox \
            --skip intercepted_apply_patch_updates_absolute_target_after_turn_cwd_is_removed
      - name: Build code-mode apply_patch host
        run: cargo build -p codex-code-mode-host --bin codex-code-mode-host
      - name: Code mode can apply_patch via nested tool
        run: cargo test -p codex-core --test all suite::code_mode::code_mode_can_apply_patch_via_nested_tool -- --exact --test-threads=1

  stock-apply-patch-sandbox:
    name: Stock apply_patch sandbox
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux sandbox dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libcap-dev bubblewrap
      - name: Build Linux sandbox helper
        run: cargo build -p codex-linux-sandbox --bin codex-linux-sandbox
      - name: Reject symlink escape outside workspace
        run: CARGO_BIN_EXE_codex_linux_sandbox="$CARGO_TARGET_DIR/debug/codex-linux-sandbox" cargo test -p codex-core --test all suite::apply_patch_cli::apply_patch_cli_does_not_write_through_symlink_escape_outside_workspace -- --exact --test-threads=1
      - name: Preserve hard link outside workspace
        if: ${{ !cancelled() }}
        run: CARGO_BIN_EXE_codex_linux_sandbox="$CARGO_TARGET_DIR/debug/codex-linux-sandbox" cargo test -p codex-core --test all suite::apply_patch_cli::apply_patch_cli_preserves_existing_hard_link_outside_workspace -- --exact --test-threads=1
      - name: Use local sandbox for intercepted verification
        if: ${{ !cancelled() }}
        run: CARGO_BIN_EXE_codex_linux_sandbox="$CARGO_TARGET_DIR/debug/codex-linux-sandbox" cargo test -p codex-core --test all suite::apply_patch_cli::intercepted_apply_patch_verification_uses_local_sandbox -- --exact --test-threads=1
      - name: Update absolute target after turn cwd removal
        if: ${{ !cancelled() }}
        run: CARGO_BIN_EXE_codex_linux_sandbox="$CARGO_TARGET_DIR/debug/codex-linux-sandbox" cargo test -p codex-core --test all suite::apply_patch_cli::intercepted_apply_patch_updates_absolute_target_after_turn_cwd_is_removed -- --exact --test-threads=1

  regression-pack:
    name: Regression pack
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Core whole-number lib
        run: cargo test -p codex-core --lib json_whole_number
      - name: Guardian and memories
        run: cargo test -p codex-guardian-v2 -p codex-memories-write --lib
      - name: MCP tool result
        run: cargo test -p codex-app-server --test all mcp_server_tool_call_returns_tool_result
      - name: History
        run: cargo test -p codex-history --lib
      - name: Image generation
        run: cargo test -p codex-image-generation-extension --lib

  cargo:
    name: Cargo
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - live-harness
      - rust-lint
      - provider-contracts
      - core-grok
      - structured-edit
      - stock-apply-patch
      - stock-apply-patch-sandbox
      - regression-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every proof domain
        env:
          LIVE_HARNESS: ${{ needs.live-harness.result }}
          RUST_LINT: ${{ needs.rust-lint.result }}
          PROVIDER_CONTRACTS: ${{ needs.provider-contracts.result }}
          CORE_GROK: ${{ needs.core-grok.result }}
          STRUCTURED_EDIT: ${{ needs.structured-edit.result }}
          STOCK_APPLY_PATCH: ${{ needs.stock-apply-patch.result }}
          STOCK_APPLY_PATCH_SANDBOX: ${{ needs.stock-apply-patch-sandbox.result }}
          REGRESSION_PACK: ${{ needs.regression-pack.result }}
        run: |
          set -euo pipefail
          for result in "$LIVE_HARNESS" "$RUST_LINT" "$PROVIDER_CONTRACTS" "$CORE_GROK" \
            "$STRUCTURED_EDIT" "$STOCK_APPLY_PATCH" "$STOCK_APPLY_PATCH_SANDBOX" \
            "$REGRESSION_PACK"; do
            test "$result" = success
          done

  build-linux-x64-musl:
    name: Build x86_64-unknown-linux-musl
    if: github.event_name == 'push'
    needs: [release-provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-grok
        with:
          target: x86_64-unknown-linux-musl

  build-pack:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    needs: [release-provenance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-grok
        with:
          target: ${{ matrix.target }}

  live:
    name: Grok Live
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.build-linux-x64-musl.result == 'success')) }}
    needs: [build-linux-x64-musl]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grok-${{ github.sha }}-x86_64-unknown-linux-musl
          path: archives
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: grok-*-x86_64-unknown-linux-musl
          merge-multiple: true
          path: archives
          run-id: ${{ github.event.inputs.binary_run_id }}
          github-token: ${{ github.token }}
      - name: Use the musl distribution
        run: chmod +x archives/bin/grok archives/bin/grok-bin archives/bin/codex-code-mode-host archives/bin/bwrap
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: grok/live/go.mod
          cache: false
      - name: Run Grok Live
        working-directory: grok/live
        env:
          GROK_LIVE: "1"
          GROK_LIVE_CODEX_BIN: ${{ github.workspace }}/archives/bin/grok-bin
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_LIVE_FAILED_SESSIONS: ${{ github.workspace }}/grok-live-failed-sessions
          GOWORK: "off"
        run: go test ./... -count=1 -timeout 30m -run '^TestGrok' -v
      - if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grok-live-failed-sessions-${{ github.sha }}
          path: grok-live-failed-sessions
          if-no-files-found: ignore
          retention-days: 7
