name: grok

on:
  pull_request:
    branches: ["grok/rust-v*", "grok/c7-web-activity-20261008", "grok/c8-package-build-20261009"]
  push:
    branches: ["grok/rust-v*"]

permissions:
  contents: read

# A newer PR head may replace its old proof. Each canonical push retains its run.
concurrency:
  group: grok-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proof:
    name: Native proof
    uses: ./.github/workflows/grok-proof.yml

  package-selection:
    name: Select binary subject
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      build-needed: ${{ steps.subject.outputs.build-needed }}
      mac-build-needed: ${{ steps.subject.outputs.mac-build-needed }}
      artifact-id: ${{ steps.subject.outputs.artifact-id }}
      source-sha: ${{ steps.subject.outputs.source-sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Resolve the latest successful line package and binary input changes
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ github.base_ref || github.ref_name }}
          INCLUDE_MACOS: ${{ github.event_name == 'push' }}
        run: |
          target_args=()
          if [[ "$INCLUDE_MACOS" == true ]]; then target_args+=(--include-macos); fi
          python3 grok/package/build_selection.py --line "$LINE" --harness-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/build-selection.json" --github-output "$GITHUB_OUTPUT" "${target_args[@]}"
      - name: Retain the binary subject decision
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grok-build-selection-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build-selection.json
          if-no-files-found: warn
          retention-days: 30

  build-linux-x64-musl:
    name: Build x86_64-unknown-linux-musl
    needs: package-selection
    if: ${{ needs.package-selection.outputs.build-needed == 'true' }}
    uses: ./.github/workflows/grok-build.yml
    with:
      target: x86_64-unknown-linux-musl

  build-macos-arm64:
    name: Build aarch64-apple-darwin
    needs: package-selection
    if: ${{ github.event_name == 'push' && needs.package-selection.outputs.mac-build-needed == 'true' }}
    uses: ./.github/workflows/grok-build.yml
    with:
      target: aarch64-apple-darwin

  reused-package-proof:
    name: Verify the reused package with current controlled fixtures
    needs: package-selection
    if: ${{ needs.package-selection.outputs.build-needed == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify the selected original producer and package
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.package-selection.outputs.artifact-id }}
          LINE: ${{ github.base_ref || github.ref_name }}
        run: |
          python3 grok/package/fetch_artifact.py --artifact-id "$ARTIFACT_ID" \
            --harness-sha "$GITHUB_SHA" --expected-line "$LINE" --output "$RUNNER_TEMP/reused-package"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: grok/go.mod
          cache: false
      - name: Prepare the hosted Linux sandbox for package acceptance
        run: bash grok/package/prepare_linux_sandbox_ci.sh
      - name: Run current controlled package acceptance without rebuilding
        env:
          GROK_CODEX_BIN: ${{ runner.temp }}/reused-package/package/bin/grok
          GROK_LIVE_NATIVE_TARGET: x86_64-unknown-linux-musl
          GROK_FACTS: "0"
          GROK_LIVE: "0"
        run: bash grok/package/verify_provider.sh "$RUNNER_TEMP/reused-package-proof"
      - name: Retain reused package proof and both subjects
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grok-reused-package-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reused-package-proof
            ${{ runner.temp }}/reused-package/selection.json
            ${{ runner.temp }}/reused-package/verified.json
          if-no-files-found: warn
          retention-days: 30

  cargo:
    name: Cargo
    needs: [proof, package-selection, build-linux-x64-musl, reused-package-proof]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require native proof and the applicable package path
        env:
          PROOF_RESULT: ${{ needs.proof.result }}
          SELECTION_RESULT: ${{ needs.package-selection.result }}
          BUILD_NEEDED: ${{ needs.package-selection.outputs.build-needed }}
          BUILD_RESULT: ${{ needs.build-linux-x64-musl.result }}
          REUSE_RESULT: ${{ needs.reused-package-proof.result }}
        run: |
          set -euo pipefail
          test "$PROOF_RESULT" = success
          test "$SELECTION_RESULT" = success
          case "$BUILD_NEEDED:$BUILD_RESULT:$REUSE_RESULT" in
            true:success:skipped|false:skipped:success) ;;
            *) echo "Applicable package proof did not succeed" >&2; exit 1 ;;
          esac

  live-selection:
    name: Select formal Live scenarios
    if: ${{ github.event_name == 'push' && github.repository == 'Harness-X-Harness/codex' && startsWith(github.ref, 'refs/heads/grok/rust-v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scenarios: ${{ steps.catalog.outputs.scenarios }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: grok/go.mod
          cache: true
          cache-dependency-path: grok/go.sum
      - name: Read the Go-owned full Live selection
        id: catalog
        working-directory: grok
        run: |
          set -euo pipefail
          scenarios="$(go run ./cmd/grok-scenarios --family live --suite full)"
          printf 'scenarios=%s\n' "$scenarios" >> "$GITHUB_OUTPUT"

  live:
    name: Grok Live (${{ matrix.scenario }})
    needs: [package-selection, build-linux-x64-musl, reused-package-proof, live-selection]
    if: ${{ !cancelled() && github.event_name == 'push' && github.repository == 'Harness-X-Harness/codex' && startsWith(github.ref, 'refs/heads/grok/rust-v') && needs.package-selection.result == 'success' && needs.live-selection.result == 'success' && ((needs.package-selection.outputs.build-needed == 'true' && needs.build-linux-x64-musl.result == 'success') || (needs.package-selection.outputs.build-needed == 'false' && needs.reused-package-proof.result == 'success')) }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: ${{ fromJSON(needs.live-selection.outputs.scenarios || '[]') }}
    uses: ./.github/workflows/grok-live.yml
    with:
      binary_artifact_id: ${{ needs.build-linux-x64-musl.outputs.artifact-id || needs.package-selection.outputs.artifact-id }}
      suite: diagnostic
      scenario: ${{ matrix.scenario }}
      formal_line: ${{ github.ref_name }}
    secrets:
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
