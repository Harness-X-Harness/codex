name: grok-migration-206-check

on:
  push:
    branches:
      - work/grok-rust-v0.154.0-206

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Test Grok API tool/search projection
        run: cargo test -p codex-api provider::grok_tests -- --nocapture
      - name: Test Grok provider behavior
        run: cargo test -p codex-model-provider grok_provider -- --nocapture
      - name: Test flat tool round-trip and apply_patch boundary
        run: cargo test -p codex-core tools::router::grok_tests -- --nocapture
      - name: Test stock apply_patch real file edit
        env:
          # Match the stock full-CI test-thread stack contract.
          RUST_MIN_STACK: "8388608"
        run: cargo test -p codex-core --test all apply_patch_normalizes_crlf_without_preserve_line_endings_feature -- --nocapture
