name: grok-migration-206-check

on:
  push:
    branches:
      - work/grok-rust-v0.154.0-206

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check

      - name: Enforce Grok-only X Search boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          forbidden = []
          for path in Path('.').rglob('*.rs'):
              text = path.read_text()
              hits = [
                  token for token in (
                      'ToolSpec::XSearch',
                      'pub x_search:',
                      'capabilities.x_search',
                      'exposes_x_search',
                  )
                  if token in text
              ]
              if hits:
                  forbidden.append((str(path), hits))

          if forbidden:
              details = '; '.join(f"{path}: {', '.join(hits)}" for path, hits in forbidden)
              raise SystemExit(
                  'Grok X Search leaked into canonical/shared capability or tool layers: ' + details
              )
          PY

      - name: Test Grok API wire projection and stock OpenAI identity
        run: cargo test -p codex-api provider::grok_tests -- --nocapture

      - name: Test Grok provider gates without stock capability changes
        run: cargo test -p codex-model-provider grok_provider -- --nocapture

      - name: Test flat tool round-trip and apply_patch boundary
        run: cargo test -p codex-core tools::router::grok_tests -- --nocapture

      - name: Test stock apply_patch executor path
        run: cargo test -p codex-core tools::handlers::apply_patch::tests -- --nocapture
