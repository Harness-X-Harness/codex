          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(tools::spec_plan::tests::structured_edit_tests::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(tools::runtimes::apply_patch::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(safety::) | test(tools::handlers::apply_patch::) | test(tools::events::) | test(turn_diff_tracker::)'
