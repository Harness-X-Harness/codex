          just test -p codex-utils-image --locked --cargo-profile ci-test --no-tests=fail --success-output=immediate
          just test -p codex-tools -p codex-history-notes-extension -p codex-agent-message-board-extension -p codex-memories-extension -p codex-web-search-extension --locked --cargo-profile ci-test --no-tests=fail --success-output=immediate
          just test -p codex-tui --lib --locked --cargo-profile ci-test --no-tests=fail --success-output=immediate -E 'test(dynamic_tools::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail --success-output=immediate -E 'test(tools::spec_plan::tests::) | test(tools::handlers::mcp_resource_spec::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail --success-output=immediate -E 'test(tools::handlers::extension_tools::) | test(image_preparation::)'
      - name: Test stock image model Code Mode history and filesystem composition
        working-directory: codex-rs
        run: |
          just test -p codex-app-server --test all --locked --cargo-profile ci-test --no-tests=fail --success-output=immediate -E 'test(suite::v2::imagegen_extension::) | test(suite::v2::dynamic_tools::)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail --success-output=immediate -E 'test(suite::extension_sandbox::) | test(suite::responses_lite::)'
      - name: Test inherited stock patch hook contracts
        working-directory: codex-rs
        run: |
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::hooks::permission_request_hook_allows_apply_patch_with_write_alias)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::hooks::pre_tool_use_blocks_apply_patch_before_execution)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::hooks::pre_tool_use_blocks_apply_patch_with_write_alias)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::hooks::pre_tool_use_rewrites_apply_patch_before_execution)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::hooks::post_tool_use_records_additional_context_for_apply_patch)'
      - name: Test stock patch filesystem composition
        working-directory: codex-rs
        run: |
          just test -p codex-apply-patch --locked --cargo-profile ci-test --no-tests=fail
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::apply_patch_cli::) | test(suite::apply_patch_serialization::) | test(suite::apply_patch_system_aliases::)'
      - name: Test affected input, mailbox, hook and shell composition
        working-directory: codex-rs
        run: >-
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail
          -E 'test(suite::turn_input_submission::) | test(suite::turn_state::)
          | test(suite::scenarios::mailbox_preemption::) | test(suite::hooks::async_hook_)
          | test(suite::user_shell_cmd::) | test(suite::interrupt_hooks::)'
      - name: Test public injection and steering APIs
        working-directory: codex-rs
        run: >-
          just test -p codex-app-server --test all --locked --cargo-profile ci-test --no-tests=fail
          -E 'test(suite::v2::thread_inject_items::) | test(suite::v2::turn_steer::)'
      - name: Test numeric exec producer composition
        working-directory: codex-rs
        run: |
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::unified_exec::)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::hooks::pre_tool_use_rewrites_exec_command_before_execution)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::hooks::pre_tool_use_rewrites_code_mode_nested_exec_command_before_execution)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::hooks::pre_tool_use_block_rejects_code_mode_tool_promise_before_execution)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::code_mode::code_mode_can_return_exec_command_output)'
      - name: Test stdin delivery and native Code Mode composition
        working-directory: codex-rs
        run: |
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::unified_exec::write_stdin_numeric_inputs_reject_before_consuming_live_session_bytes)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::code_mode::code_mode_write_stdin_numeric_inputs_use_returned_session)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::code_mode::code_mode_write_stdin_calls_run_in_parallel_across_sessions)'
      - name: Test goal state and advisory steering contracts
        working-directory: codex-rs
        run: just test -p codex-goal-extension --locked --cargo-profile ci-test --no-tests=fail
      - name: Test generic numeric hook composition
        working-directory: codex-rs
        run: |
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::hooks::numeric_tests::pre_tool_use_rewrites_wait_agent_exact_numeric_timeout)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::hooks::pre_tool_use_rewrites_local_function_tool_before_execution)'
      - name: Test CLI display contracts
        working-directory: codex-rs
        run: just test -p codex-exec --lib --locked --cargo-profile ci-test --no-tests=fail
      - name: Test both Responses reasoning displays
        working-directory: codex-rs
        run: >-
          just test -p codex-tui --lib --locked --cargo-profile ci-test --no-tests=fail
          -E 'test(status::tests::status_snapshot_responses_dialects_show_configured_reasoning)'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: grok/go.mod
          cache: false
      - name: Test real App Server and controlled Grok HTTP composition
        working-directory: grok
        env:
          GROK_FACTS: "0"
          GROK_LIVE: "0"
        run: |
          export GROK_LIVE_NATIVE_BIN="$CARGO_TARGET_DIR/ci-test/codex"
          test -x "$GROK_LIVE_NATIVE_BIN"
          go test -race -count=1 -timeout=6m -v ./live
      - name: Check scoped filesystem API lint
        working-directory: codex-rs
        run: just clippy -p codex-file-system -p codex-exec-server-protocol -p codex-exec-server --locked --profile ci-test --timings -- --no-deps --cap-lints=forbid
      - name: Check scoped Provider runtime lint
        working-directory: codex-rs
        run: >-
          just clippy -p codex-model-provider-info -p codex-model-provider -p codex-config
          -p codex-core -p codex-exec -p codex-tui -p codex-code-mode-host
          -p codex-protocol -p codex-rollout-trace -p codex-apply-patch -p codex-models-manager
          -p codex-prompts -p codex-image-generation-extension -p codex-utils-image -p codex-tools -p codex-app-server -p codex-history-notes-extension -p codex-agent-message-board-extension -p codex-memories-extension -p codex-web-search-extension --locked --profile ci-test --timings -- --no-deps --cap-lints=forbid
      - name: Verify clean worktree
        if: ${{ always() }}
        uses: ./.github/actions/check-clean-worktree
      - name: Record final native build resources
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [[ -r "$RUNNER_TEMP/grok-build-resources.py" ]]; then
            python3 "$RUNNER_TEMP/grok-build-resources.py"
          else
            echo "native resource measurements unavailable"
          fi | tee "$RUNNER_TEMP/grok-runtime-resources-end.txt"
      - name: Retain native build measurements
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-build-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/grok-runtime-resources-*.txt
            ${{ runner.temp }}/c4b-composition-binaries.txt
            ${{ env.CARGO_TARGET_DIR }}/cargo-timings/cargo-timing-*.html
          if-no-files-found: warn
          retention-days: 7
      - name: Retain native changes on failure
        if: ${{ failure() }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --binary > "$RUNNER_TEMP/provider-native.diff"
          {
            printf '%s\n' "repository=$GITHUB_REPOSITORY" \
              "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB" \
              "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF" \
              "checkout=$(git rev-parse HEAD)" \
              "pr_head=$PR_HEAD_SHA pr_base=$PR_BASE_SHA" \
              "workflow_sha=$GITHUB_WORKFLOW_SHA"
            cargo --version || echo "cargo unavailable"
            rustfmt --version || echo "rustfmt unavailable"
            cargo clippy --version || echo "clippy unavailable"
          } > "$RUNNER_TEMP/provider-native-subject.txt"
          if [[ $(wc -c < "$RUNNER_TEMP/provider-native.diff") -gt 10485760 ]]; then
            echo "Patch exceeds 10 MiB; omitted for manual diagnosis." >> "$RUNNER_TEMP/provider-native-subject.txt"
            rm "$RUNNER_TEMP/provider-native.diff"
          fi
      - name: Retain generated representations on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: provider-representations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codex-rs/core/config.schema.json
            codex-rs/tui/src/**/*.snap.new
            ${{ runner.temp }}/provider-native.diff
            ${{ runner.temp }}/provider-native-subject.txt
          if-no-files-found: error

  go:
    name: Deterministic Facts and Live proof
    needs: subject
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GROK_FACTS: "0"
      GROK_LIVE: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: grok/go.mod
          cache: false
      - name: Require formatted Go scenario source
        working-directory: grok
        run: test -z "$(gofmt -l .)"
      - name: Test Facts HTTP and Live stdio boundaries without backend calls
        working-directory: grok
        run: go test -race -count=1 -timeout=6m -v ./facts ./live
      - name: Vet the consumed Go foundation
        working-directory: grok
        run: go vet ./...
      - name: Verify clean worktree
        if: ${{ always() }}
        uses: ./.github/actions/check-clean-worktree

  complete:
    name: Native proof result
    needs: [subject, locks, runtime, go]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native job
        env:
          SUBJECT_RESULT: ${{ needs.subject.result }}
          LOCKS_RESULT: ${{ needs.locks.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          GO_RESULT: ${{ needs.go.result }}
        run: |
          for result in "$SUBJECT_RESULT" "$LOCKS_RESULT" "$RUNTIME_RESULT" "$GO_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required native job did not succeed: $result" >&2
              exit 1
            fi
          done
