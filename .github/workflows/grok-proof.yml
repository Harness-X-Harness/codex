name: grok-proof

on:
  workflow_call:

permissions:
  contents: read

jobs:
  subject:
    name: Execution subject
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the PR or canonical execution subject
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          printf '%s\n' \
            "repository=$GITHUB_REPOSITORY" \
            "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT" \
            "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF" \
            "pr_head=$PR_HEAD_SHA pr_base=$PR_BASE_SHA" \
            "checkout=$checkout_sha" \
            "workflow_ref=$GITHUB_WORKFLOW_REF" \
            "workflow_sha=$GITHUB_WORKFLOW_SHA"
          test "$checkout_sha" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test "$GITHUB_REF" = "refs/pull/$PR_NUMBER/merge"
              test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA"
              test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
              ;;
            push)
              case "$GITHUB_REF" in
                refs/heads/grok/rust-v*) ;;
                *) echo "Unexpected canonical ref: $GITHUB_REF" >&2; exit 1 ;;
              esac
              ;;
            *) echo "Unexpected proof event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          # The checked-out proof definition must match the caller's workflow revision.
          git diff --exit-code "$GITHUB_WORKFLOW_SHA" HEAD -- \
            .github/workflows/grok.yml .github/workflows/grok-proof.yml

  locks:
    name: Native lock consistency
    needs: subject
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103
      - name: Verify locked Cargo resolution
        working-directory: codex-rs
        run: cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
      - name: Regenerate and check Cargo-owned Bazel lock
        run: |
          just bazel-lock-update
          just bazel-lock-check
          git diff --exit-code -- codex-rs/Cargo.lock MODULE.bazel.lock
      - name: Test Provider metadata with the locked workspace
        working-directory: codex-rs
        run: just test -p codex-model-provider-info --locked --cargo-profile ci-test --no-tests=fail
      - name: Retain generated locks on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-locks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codex-rs/Cargo.lock
            MODULE.bazel.lock
          if-no-files-found: error
      - name: Verify clean worktree
        if: ${{ always() }}
        uses: ./.github/actions/check-clean-worktree

  complete:
    name: Native proof result
    needs: [subject, locks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native job
        env:
          SUBJECT_RESULT: ${{ needs.subject.result }}
          LOCKS_RESULT: ${{ needs.locks.result }}
        run: |
          for result in "$SUBJECT_RESULT" "$LOCKS_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required native job did not succeed: $result" >&2
              exit 1
            fi
          done
