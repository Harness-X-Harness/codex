name: grok-proof

on:
  workflow_call:

permissions:
  contents: read

jobs:
  subject:
    name: Execution subject
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the PR or canonical execution subject
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          checkout_sha="$(git rev-parse HEAD)"
          printf '%s\n' \
            "repository=$GITHUB_REPOSITORY" \
            "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT" \
            "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF" \
            "pr_head=$PR_HEAD_SHA pr_base=$PR_BASE_SHA" \
            "checkout=$checkout_sha" \
            "workflow_ref=$GITHUB_WORKFLOW_REF" \
            "workflow_sha=$GITHUB_WORKFLOW_SHA"
          test "$checkout_sha" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test "$GITHUB_REF" = "refs/pull/$PR_NUMBER/merge"
              test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA"
              test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
              ;;
            push)
              case "$GITHUB_REF" in
                refs/heads/grok/rust-v*) ;;
                *) echo "Unexpected canonical ref: $GITHUB_REF" >&2; exit 1 ;;
              esac
              ;;
            *) echo "Unexpected proof event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          # The checked-out proof definition must match the caller's workflow revision.
          git diff --exit-code "$GITHUB_WORKFLOW_SHA" HEAD -- \
            .github/workflows/grok.yml .github/workflows/grok-proof.yml \
            .github/actions/setup-ci/action.yml .github/actions/setup-bazel-ci/action.yml

  locks:
    name: Native Provider/API proof
    needs: subject
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          configure-linux-user-namespaces: "false"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103
      - name: Verify locked Cargo resolution
        working-directory: codex-rs
        run: cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
      - name: Regenerate and check Cargo-owned Bazel lock
        run: |
          just bazel-lock-update
          just bazel-lock-check
          git diff --exit-code -- codex-rs/Cargo.lock MODULE.bazel.lock
      - name: Fix scoped API lint
        working-directory: codex-rs
        run: just fix -p codex-api --locked --profile ci-test --timings
      - name: Require unchanged API construction input
        uses: ./.github/actions/check-clean-worktree
      - name: Test Provider metadata with the locked workspace
        working-directory: codex-rs
        run: just test -p codex-model-provider-info --locked --cargo-profile ci-test --no-tests=fail
      - name: Test Grok and affected stock API contracts
        working-directory: codex-rs
        run: just test -p codex-api --locked --cargo-profile ci-test --no-tests=fail
      # Cargo fix caps diagnostics at warn. A distinct maximal cap rechecks
      # the existing lint policy instead of reusing the fixer's cached result.
      - name: Check scoped API lint
        working-directory: codex-rs
        run: just clippy -p codex-api --locked --profile ci-test --timings -- --no-deps --cap-lints=forbid
      - name: Verify clean worktree
        if: ${{ always() }}
        uses: ./.github/actions/check-clean-worktree
      - name: Retain API changes on failure
        if: ${{ failure() }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --binary > "$RUNNER_TEMP/api-native.diff"
          {
            printf '%s\n' "repository=$GITHUB_REPOSITORY" \
              "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB" \
              "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF" \
              "checkout=$(git rev-parse HEAD)" \
              "pr_head=$PR_HEAD_SHA pr_base=$PR_BASE_SHA" \
              "workflow_sha=$GITHUB_WORKFLOW_SHA"
            cargo --version || echo "cargo unavailable"
            rustfmt --version || echo "rustfmt unavailable"
            cargo clippy --version || echo "clippy unavailable"
          } > "$RUNNER_TEMP/api-native-subject.txt"
          if [[ $(wc -c < "$RUNNER_TEMP/api-native.diff") -gt 10485760 ]]; then
            echo "Patch exceeds 10 MiB; omitted for manual diagnosis." >> "$RUNNER_TEMP/api-native-subject.txt"
            rm "$RUNNER_TEMP/api-native.diff"
          fi
      - name: Retain generated locks on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-locks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codex-rs/Cargo.lock
            MODULE.bazel.lock
            ${{ runner.temp }}/api-native.diff
            ${{ runner.temp }}/api-native-subject.txt
          if-no-files-found: error

  runtime:
    name: Native runtime proof
    needs: subject
    runs-on: ubuntu-22.04
    timeout-minutes: 105
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_CI_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          configure-linux-user-namespaces: "false"
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt
      - name: Normalize scoped Rust formatting
        working-directory: codex-rs
        run: |
          cargo fmt -p codex-code-mode-host -- --config imports_granularity=Item
          cargo fmt -p codex-model-provider -p codex-core -p codex-protocol -p codex-rollout-trace -p codex-apply-patch -p codex-models-manager -p codex-prompts -p codex-api -p codex-app-server -p codex-image-generation-extension -p codex-utils-image -p codex-tools -p codex-history-notes-extension -p codex-agent-message-board-extension -p codex-memories-extension -p codex-web-search-extension -- --config imports_granularity=Item
      - name: Require unchanged formatting input
        uses: ./.github/actions/check-clean-worktree
      - name: Check Code Mode host fixture formatting
        working-directory: codex-rs
        run: cargo fmt -p codex-code-mode-host -- --config imports_granularity=Item --check
      - name: Check affected Provider runtime crate formatting
        working-directory: codex-rs
        run: cargo fmt -p codex-model-provider -p codex-core -p codex-protocol -p codex-rollout-trace -p codex-apply-patch -p codex-models-manager -p codex-prompts -p codex-api -p codex-app-server -p codex-image-generation-extension -p codex-utils-image -p codex-tools -p codex-history-notes-extension -p codex-agent-message-board-extension -p codex-memories-extension -p codex-web-search-extension -- --config imports_granularity=Item --check
      - name: Install native Linux test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev libasound2-dev bubblewrap
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest@0.9.103
      - name: Require sandbox startup capability under existing Linux permissions
        run: |
          test "$(id -u)" != "0"
          for setting in kernel/unprivileged_userns_clone kernel/apparmor_restrict_unprivileged_userns; do
            if [[ -r "/proc/sys/$setting" ]]; then
              printf '%s=' "$setting"
              cat "/proc/sys/$setting"
            fi
          done
          bwrap --version
          # This checks namespace startup only. Product tests own the supported
          # proc-mount fallback and actual selected-helper filesystem enforcement.
          if ! timeout 15s bwrap --unshare-user --unshare-ipc --unshare-pid --unshare-net \
            --cap-drop ALL --die-with-parent --new-session \
            --ro-bind / / --dev /dev -- /bin/true; then
            echo "Required Linux user/IPC/PID/network namespace sandbox cannot start under existing runner permissions." >&2
            echo "No kernel or AppArmor setting was changed. Use a compatible runner or obtain a separately reviewed permission decision." >&2
            exit 1
          fi
      - name: Record bounded native build inputs
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/grok-build-resources.py" <<'PYCODE'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess


          def read_metric(path):
              try:
                  with path.open() as source:
                      return source.read(512).strip()
              except OSError:
                  return "unavailable"


          def disk_metric(variable):
              try:
                  usage = shutil.disk_usage(os.environ[variable])
                  return dict(zip(("total", "used", "free"), usage))
              except (KeyError, OSError):
                  return "unavailable"


          result = {"cpu_count": os.cpu_count()}
          try:
              result["affinity_cpu_count"] = len(os.sched_getaffinity(0))
          except (AttributeError, OSError):
              result["affinity_cpu_count"] = "unavailable"
          try:
              result["physical_memory_kib"] = next(
                  int(line.split()[1]) for line in Path("/proc/meminfo").read_text().splitlines()
                  if line.startswith("MemTotal:")
              )
          except (OSError, StopIteration, ValueError):
              result["physical_memory_kib"] = "unavailable"
          result["cgroup_v2_leaf_then_ancestors"] = "unavailable"
          try:
              relative = next(
                  line.split(":", 2)[2] for line in Path("/proc/self/cgroup").read_text().splitlines()
                  if line.startswith("0::")
              )
              root = Path("/sys/fs/cgroup")
              group = (root / relative.lstrip("/")).resolve()
              groups = []
              while group.is_relative_to(root) and len(groups) < 16:
                  groups.append({name: read_metric(group / name) for name in (
                      "cpu.max", "memory.max", "memory.peak", "memory.events"
                  )})
                  group = group.parent
              result["cgroup_v2_leaf_then_ancestors"] = groups or "unavailable"
              result["cgroup_ancestors_truncated"] = group.is_relative_to(root)
          except (OSError, StopIteration):
              pass
          result["workspace_disk_bytes"] = disk_metric("GITHUB_WORKSPACE")
          result["target_disk_bytes"] = disk_metric("CARGO_TARGET_DIR")
          try:
              size = subprocess.run(
                  ["du", "-sb", "--", os.environ["CARGO_TARGET_DIR"]],
                  check=True, capture_output=True, text=True, timeout=10,
              )
              result["target_apparent_bytes"] = int(size.stdout.split()[0])
          except (KeyError, OSError, ValueError, subprocess.SubprocessError):
              result["target_apparent_bytes"] = "unavailable"
          print(json.dumps(result, sort_keys=True))
          PYCODE
          {
            rustc --version --verbose
            cargo --version
            cargo nextest --version
            printf '%s\n' "build_jobs=$CARGO_BUILD_JOBS incremental=$CARGO_INCREMENTAL" \
              "dev_debug=$CARGO_PROFILE_DEV_DEBUG ci_test_debug=$CARGO_PROFILE_CI_TEST_DEBUG"
            python3 "$RUNNER_TEMP/grok-build-resources.py"
          } | tee "$RUNNER_TEMP/grok-runtime-resources-start.txt"
      - name: Set up Python for pinned V8 metadata
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Set up pinned Code Mode V8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-unknown-linux-gnu
      - name: Build the consumed Code Mode host
        working-directory: codex-rs
        run: cargo build -p codex-code-mode-host --bin codex-code-mode-host --locked --profile ci-test --timings
      - name: Fix scoped Code Mode host lint
        working-directory: codex-rs
        run: cargo clippy --fix --allow-dirty -p codex-code-mode-host --test stdio --locked --profile ci-test --timings
      - name: Require unchanged host construction input
        uses: ./.github/actions/check-clean-worktree
      - name: Fix scoped Provider runtime lint
        working-directory: codex-rs
        run: >-
          just fix -p codex-model-provider-info -p codex-model-provider -p codex-config
          -p codex-core -p codex-exec -p codex-tui -p codex-code-mode-host
          -p codex-protocol -p codex-rollout-trace -p codex-apply-patch -p codex-models-manager
          -p codex-prompts -p codex-image-generation-extension -p codex-utils-image -p codex-tools -p codex-app-server -p codex-history-notes-extension -p codex-agent-message-board-extension -p codex-memories-extension -p codex-web-search-extension --locked --profile ci-test --timings
      - name: Require unchanged runtime construction input
        uses: ./.github/actions/check-clean-worktree
      - name: Regenerate owned configuration schema
        working-directory: codex-rs
        run: |
          just write-config-schema --locked --profile ci-test --timings
          # The profile may change build reuse, never the owned schema bytes.
          git show HEAD:codex-rs/core/config.schema.json | cmp - core/config.schema.json
      - name: Normalize filesystem API formatting
        working-directory: codex-rs
        run: cargo fmt -p codex-file-system -p codex-exec-server-protocol -p codex-exec-server -- --config imports_granularity=Item
      - name: Require unchanged filesystem formatting input
        uses: ./.github/actions/check-clean-worktree
      - name: Fix scoped filesystem API lint
        working-directory: codex-rs
        run: just fix -p codex-file-system -p codex-exec-server-protocol -p codex-exec-server --locked --profile ci-test --timings
      - name: Require unchanged filesystem construction input
        uses: ./.github/actions/check-clean-worktree
      - name: Freeze unchanged native proof input
        uses: ./.github/actions/check-clean-worktree
      - name: Check filesystem API formatting
        working-directory: codex-rs
        run: cargo fmt -p codex-file-system -p codex-exec-server-protocol -p codex-exec-server -- --config imports_granularity=Item --check
      - name: Test conditional API and actual mutation ownership
        working-directory: codex-rs
        run: |
          just test -p codex-exec-server-protocol --lib --locked --cargo-profile ci-test --no-tests=fail
          just test -p codex-exec-server --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(file_system_mutation::tests::)'
          just test -p codex-exec-server --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(server::transport::conditional_write_tests::)'
          just test -p codex-exec-server --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(fs_sandbox::effect_tests::)'
          just test -p codex-exec-server --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(fs_sandbox::windows_tests::)'
          just test -p codex-exec-server --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(local_file_system::) | test(remote_file_system::)'
          just test -p codex-exec-server --test file_system_unix --locked --cargo-profile ci-test --no-tests=fail
      - name: Test the adapted host interrupt fixture
        working-directory: codex-rs
        run: >-
          just test -p codex-code-mode-host --test stdio --locked --cargo-profile ci-test --no-tests=fail
          -E 'test(interrupt_yields_observations_without_stopping_the_cell)'
      - name: Check scoped Code Mode host lint
        working-directory: codex-rs
        run: cargo clippy -p codex-code-mode-host --test stdio --locked --profile ci-test --timings -- --no-deps --cap-lints=forbid
      - name: Test standalone Code Mode numeric forwarding
        working-directory: codex-rs
        run: |
          just test -p codex-code-mode-host --test stdio --locked --cargo-profile ci-test --no-tests=fail -E 'test(remote_session_persists_values_forwards_delegates_and_controls_cells)'
          just test -p codex-code-mode-host --test stdio --locked --cargo-profile ci-test --no-tests=fail -E 'test(exact_numbers::numeric_oracle_accepts_equivalent_spellings_and_distinguishes_rounding)'
          just test -p codex-code-mode-host --test grpc --locked --cargo-profile ci-test --no-tests=fail -E 'test(tcp_session_persists_values_and_forwards_tools_notifications_and_closure)'
          just test -p codex-code-mode-host --test grpc --locked --cargo-profile ci-test --no-tests=fail -E 'test(exact_numbers::numeric_oracle_accepts_equivalent_spellings_and_distinguishes_rounding)'
      - name: Test Provider policy and configuration boundaries
        working-directory: codex-rs
        run: just test -p codex-model-provider -p codex-config --locked --cargo-profile ci-test --no-tests=fail
      - name: Test affected client and configuration unit contracts
        working-directory: codex-rs
        run: >-
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail
          -E 'test(client::) | test(client_common::) | test(config::)'
      - name: Test exact exec and stdin numeric admission
        working-directory: codex-rs
        run: |
          just test -p codex-protocol --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(json_whole_number::tests::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(tools::handlers::unified_exec::numeric_tests::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(tools::handlers::unified_exec::tests::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(tools::handlers::unified_exec::write_stdin::numeric_tests::)'
      - name: Test stdin trace replay and affected stock reducers
        working-directory: codex-rs
        run: |
          just test -p codex-rollout-trace --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(whole_number_stdin_replay_)'
          just test -p codex-rollout-trace --lib --locked --cargo-profile ci-test --no-tests=fail
      - name: Test production Provider composition
        working-directory: codex-rs
        run: >-
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail
          -E 'test(suite::grok_provider::) | test(suite::client::) | test(suite::client_websockets::)
          | test(suite::websocket_fallback::) | test(suite::auth_recovery_policy::)
          | test(suite::gateway_auth::) | test(suite::cloud_config::)'
      - name: Test exact wait and fork numeric admission
        working-directory: codex-rs
        run: |
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(tools::handlers::multi_agents::wait::numeric_tests::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(tools::handlers::multi_agents_v2::wait::numeric_tests::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(tools::handlers::multi_agents_v2::spawn::numeric_tests::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(tools::handlers::multi_agents::tests::wait_numeric_tests::)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(tools::handlers::multi_agents::tests::fork_numeric_tests::)'
      - name: Test affected wait and fork handler contracts
        working-directory: codex-rs
        run: >-
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail
          -E 'test(tools::handlers::multi_agents::tests::wait_agent_)
          | test(tools::handlers::multi_agents::tests::multi_agent_v2_wait_agent_)
          | test(tools::handlers::multi_agents::tests::multi_agent_v2_spawn_)
          | test(full_history_fork_inherits_root_service_tier)'
      - name: Test explicit-dialect compaction and stock consumers
        working-directory: codex-rs
        run: |
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::grok_provider::compaction::)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::compact::summarize_context_three_requests_and_instructions)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::compact::auto_compact_runs_after_token_limit_hit)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::compact_remote::remote_compact_v2_reuses_compaction_trigger_for_followups)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::token_budget::token_budget_context_uses_new_window_after_compaction)'
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail -E 'test(suite::token_budget::token_budget_mid_turn_auto_compaction_resets_before_active_follow_up)'
      - name: Test queue admission and affected lifecycle contracts
        working-directory: codex-rs
        run: >-
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail
          -E 'test(session::) | test(tasks::) | test(agent::control::)'
      - name: Test each required close-boundary regression
        working-directory: codex-rs
        run: |
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(session::input_queue::close_tests::closed_turn_input_returns_snapshot_and_rejects_later_appends)'
          just test -p codex-core --lib --locked --cargo-profile ci-test --no-tests=fail -E 'test(session::inject::tests::client_inject_records_history_after_turn_input_is_closed)'
      - name: Test the real turn-completion input boundary
        working-directory: codex-rs
        run: >-
          just test -p codex-core --test all --locked --cargo-profile ci-test --no-tests=fail
          -E 'test(suite::turn_input_completion::)'
      - name: Build the exact CLI for native integrations and Basic fixture
        working-directory: codex-rs
        run: cargo build -p codex-cli --bin codex --locked --profile ci-test --timings
      - name: Bind exact editor composition binaries
        working-directory: codex-rs
        run: |
          cargo build -p codex-linux-sandbox --bin codex-linux-sandbox --locked --profile ci-test --timings
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for binary in codex codex-linux-sandbox codex-code-mode-host; do
            test -x "$CARGO_TARGET_DIR/ci-test/$binary"
          done
          {
            printf '%s\n' "checkout=$(git rev-parse HEAD)" "profile=ci-test"
            sha256sum "$CARGO_TARGET_DIR/ci-test/codex" \
              "$CARGO_TARGET_DIR/ci-test/codex-linux-sandbox" \
              "$CARGO_TARGET_DIR/ci-test/codex-code-mode-host"
          } | tee "$RUNNER_TEMP/c4b-composition-binaries.txt"
          printf '%s\n' \
            "CODEX_C4B_REQUIRED=1" \
            "CODEX_C4B_TEST_CLI=$CARGO_TARGET_DIR/ci-test/codex" \
            "CODEX_C4B_TEST_CLI_SHA256=$(sha256sum "$CARGO_TARGET_DIR/ci-test/codex" | cut -d ' ' -f 1)" \
            "CODEX_TEST_LINUX_SANDBOX_EXE=$CARGO_TARGET_DIR/ci-test/codex-linux-sandbox" \
            "CODEX_TEST_LINUX_SANDBOX_EXE_SHA256=$(sha256sum "$CARGO_TARGET_DIR/ci-test/codex-linux-sandbox" | cut -d ' ' -f 1)" \
            "CODEX_C4B_CODE_MODE_HOST=$CARGO_TARGET_DIR/ci-test/codex-code-mode-host" \
            "CODEX_C4B_CODE_MODE_HOST_SHA256=$(sha256sum "$CARGO_TARGET_DIR/ci-test/codex-code-mode-host" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Require unchanged editor composition input
