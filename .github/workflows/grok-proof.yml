          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CODEX_C4B_TEST_CLI_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(sha256sum "$GROK_CODEX_BIN" | cut -d ' ' -f 1)" = "$CODEX_C4B_TEST_CLI_SHA256"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          fields = ("GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_EVENT_NAME",
                    "GITHUB_REF", "GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA",
                    "PR_HEAD_SHA", "PR_BASE_SHA", "CODEX_C4B_TEST_CLI_SOURCE_SHA", "CODEX_C4B_TEST_CLI_SHA256")
          subject = {key: os.environ[key] for key in fields}
          subject["subject_kind"] = "pr_test_merge" if os.environ["GITHUB_EVENT_NAME"] == "pull_request" else "branch_head"
          subject["binary_target"] = "x86_64-unknown-linux-gnu"
          subject["binary_profile"] = "ci-test"
          (Path(os.environ["RUNNER_TEMP"]) / "grok-integration-evidence/subject.json").write_text(json.dumps(subject, sort_keys=True) + "\n")
          PYCODE
          status=0
          go test -race -tags=integration -count=1 -timeout=20m -json \
            ./tests/integration \
            > "$RUNNER_TEMP/grok-integration-evidence/tests.json" || status=$?
          go run ./cmd/grok-test-results --integration \
            --input "$RUNNER_TEMP/grok-integration-evidence/tests.json" \
            > "$RUNNER_TEMP/grok-integration-evidence/summary.json" || status=1
          cat "$RUNNER_TEMP/grok-integration-evidence/summary.json"
          test "$(sha256sum "$GROK_CODEX_BIN" | cut -d ' ' -f 1)" = "$CODEX_C4B_TEST_CLI_SHA256" || status=1
          exit "$status"
      - name: Retain Go integration results even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grok-integration-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grok-integration-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Check scoped filesystem API lint
        env:
          # sccache 0.18 expects the literal compiler name in Clippy wrapper arguments.
          RUSTC: rustc
        working-directory: codex-rs
        run: just clippy -p codex-file-system -p codex-exec-server-protocol -p codex-exec-server --locked --profile ci-test --timings -- --no-deps --cap-lints=forbid
      - name: Check scoped Provider runtime lint
        env:
          # sccache 0.18 expects the literal compiler name in Clippy wrapper arguments.
          RUSTC: rustc
        working-directory: codex-rs
        run: >-
          python3 ../.github/scripts/grok-stock-lint.py just clippy -p codex-model-provider-info -p codex-model-provider -p codex-config
          -p codex-core -p core_test_support -p codex-exec -p codex-tui -p codex-code-mode-host
          -p codex-protocol -p codex-rollout -p codex-thread-store -p codex-rollout-trace -p codex-goal-extension -p codex-otel -p codex-analytics -p codex-app-server-protocol -p codex-apply-patch -p codex-models-manager
          -p codex-prompts -p codex-image-generation-extension -p codex-utils-image -p codex-tools -p codex-app-server -p codex-history-notes-extension -p codex-agent-message-board-extension -p codex-memories-extension -p codex-memories-write -p codex-web-search-extension --locked --profile ci-test --timings -- --no-deps --cap-lints=forbid
      - name: Verify clean worktree
        if: ${{ always() }}
        uses: ./.github/actions/check-clean-worktree
      - name: Record compiler-cache measurements
        if: ${{ always() }}
        continue-on-error: true
        run: |
          # Unlike --show-stats alone, shutdown fails if the daemon was lost;
          # unavailable counters must not masquerade as a healthy zero-hit cache.
          if command -v sccache >/dev/null && timeout 30s sccache --stop-server >> "$RUNNER_TEMP/grok-sccache-measurements.txt"; then
            cat "$RUNNER_TEMP/grok-sccache-measurements.txt"
          else
            echo "::warning::Compiler-cache statistics unavailable; this run cannot establish cache effectiveness."
            echo "statistics=unavailable" >> "$RUNNER_TEMP/grok-sccache-measurements.txt"
          fi
      - name: Retain compiler-cache measurements
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiler-cache-measurements-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grok-sccache-measurements.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Record final native build resources
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [[ -r "$RUNNER_TEMP/grok-build-resources.py" ]]; then
            python3 "$RUNNER_TEMP/grok-build-resources.py"
          else
            echo "native resource measurements unavailable"
          fi | tee "$RUNNER_TEMP/grok-runtime-resources-end.txt"
      - name: Retain native build measurements
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-build-measurements-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/grok-runtime-resources-*.txt
            ${{ runner.temp }}/c4b-composition-binaries.txt
            ${{ env.CARGO_TARGET_DIR }}/cargo-timings/cargo-timing-*.html
          if-no-files-found: warn
          retention-days: 7
      - name: Retain native changes on failure
        if: ${{ failure() }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --binary > "$RUNNER_TEMP/provider-native.diff"
          {
            printf '%s\n' "repository=$GITHUB_REPOSITORY" \
              "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB" \
              "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF" \
              "checkout=$(git rev-parse HEAD)" \
              "pr_head=$PR_HEAD_SHA pr_base=$PR_BASE_SHA" \
              "workflow_sha=$GITHUB_WORKFLOW_SHA"
            cargo --version || echo "cargo unavailable"
            rustfmt --version || echo "rustfmt unavailable"
            cargo clippy --version || echo "clippy unavailable"
          } > "$RUNNER_TEMP/provider-native-subject.txt"
          if [[ $(wc -c < "$RUNNER_TEMP/provider-native.diff") -gt 10485760 ]]; then
            echo "Patch exceeds 10 MiB; omitted for manual diagnosis." >> "$RUNNER_TEMP/provider-native-subject.txt"
            rm "$RUNNER_TEMP/provider-native.diff"
          fi
      - name: Stage owned inline search snapshots on failure
        if: ${{ failure() }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import shutil

          root = Path("codex-rs/tui/src")
          output = Path(os.environ["RUNNER_TEMP"]) / "grok-search-activity-inline-snapshots"
          for source in (
              Path("chatwidget/tests/search_activity_tests.rs"),
              Path("history_cell/search_tests.rs"),
              Path("app/agent_status_feed_tests.rs"),
              Path("thread_transcript/other_items_tests.rs"),
          ):
              pending = root / source.parent / f".{source.name}.pending-snap"
              if pending.is_file():
                  destination = output / source.parent / f"{source.name}.pending-snap"
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(pending, destination)
          PYCODE
      - name: Retain generated representations on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-representations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codex-rs/core/config.schema.json
            codex-rs/app-server-protocol/schema
            sdk/python/src/openai_codex/generated
            sdk/python/src/openai_codex/api.py
            codex-rs/tui/src/**/*.snap.new
            ${{ runner.temp }}/grok-search-activity-inline-snapshots
            ${{ runner.temp }}/provider-native.diff
            ${{ runner.temp }}/provider-native-subject.txt
          if-no-files-found: error

  go:
    name: Deterministic Go contracts
    needs: subject
    if: ${{ inputs.offline_go }}
    uses: ./.github/workflows/grok-go.yml

  complete:
    name: Native proof result
    needs: [subject, locks, runtime, go]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native job
        env:
          SUBJECT_RESULT: ${{ needs.subject.result }}
          LOCKS_RESULT: ${{ needs.locks.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          GO_RESULT: ${{ needs.go.result }}
          OFFLINE_GO: ${{ inputs.offline_go }}
        run: |
          set -euo pipefail
          for result in "$SUBJECT_RESULT" "$LOCKS_RESULT" "$RUNTIME_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required native job did not succeed: $result" >&2
              exit 1
            fi
          done

          if [[ "$OFFLINE_GO" == true ]]; then
            test "$GO_RESULT" = success
          else
            test "$GO_RESULT" = skipped
          fi
