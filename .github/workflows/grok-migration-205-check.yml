name: grok-migration-205-check

on:
  push:
    branches:
      - work/grok-rust-v0.154.0-205

jobs:
  responses-history-reasoning:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Test Grok Responses dialect contracts
        run: cargo test -p codex-api provider::grok_tests -- --nocapture
      - name: Test Grok reasoning and compaction contracts
        run: cargo test -p codex-model-provider grok_provider -- --nocapture
      - name: Test stock reasoning request normalization
        run: cargo test -p codex-core reasoning_effort_for_requests -- --nocapture
