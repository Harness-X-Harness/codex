name: grok-migration-206-materialize

on:
  push:
    branches:
      - work/grok-rust-v0.154.0-206

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[206-implementation]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Extract and run migration recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/grok-migration-206-check.yml')
          lines = path.read_text().splitlines()
          start = None
          end = None
          for i, line in enumerate(lines):
              if line == '      - name: Apply #206 semantic migration':
                  start = i
              elif start is not None and i > start and line.startswith('      - ') and line != '      - name: Apply #206 semantic migration':
                  end = i
                  break
          if start is None or end is None:
              raise SystemExit('migration recipe step not found')
          run_index = next(i for i in range(start, end) if lines[i] == '        run: |')
          body = lines[run_index + 1:end]
          prefix = '          '
          if any(line and not line.startswith(prefix) for line in body):
              raise SystemExit('unexpected migration recipe indentation')
          script = '\n'.join(line[len(prefix):] if line else '' for line in body) + '\n'
          Path('/tmp/grok-206-migrate.sh').write_text(script)
          PY
          bash /tmp/grok-206-migrate.sh
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Format materialized sources
        working-directory: codex-rs
        run: cargo fmt -- --config imports_granularity=Item
      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs
          git commit -m "feat(grok): migrate tool projection and search contracts [206-implementation]"
          git push origin HEAD:work/grok-rust-v0.154.0-206
