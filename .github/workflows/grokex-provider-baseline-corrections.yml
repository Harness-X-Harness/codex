name: Grokex provider baseline corrections

on:
  pull_request:
    branches:
      - codex/issues-129-130-provider-baseline

permissions:
  contents: read

concurrency:
  group: grokex-provider-baseline-corrections
  cancel-in-progress: false

jobs:
  provider-baseline:
    if: github.head_ref == 'codex/issues-129-130-provider-baseline-validation-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Linux Cargo environment
        uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: Capture authoritative formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt -- --config imports_granularity=Item
          cd ..
          git diff --binary > "${RUNNER_TEMP}/provider-baseline-authority.patch"
          git status --short > "${RUNNER_TEMP}/provider-baseline-authority-status.txt"

      - name: Upload authoritative mechanical changes
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: provider-baseline-authority
          path: |
            ${{ runner.temp }}/provider-baseline-authority.patch
            ${{ runner.temp }}/provider-baseline-authority-status.txt
          if-no-files-found: error

      - name: Test affected Provider contracts
        run: |
          just test -p codex-model-provider
          just test -p codex-config
          just test -p codex-memories-write
          just test -p codex-guardian-v2
          cargo nextest run -p codex-core 'guardian_review_session_config_rejects_provider_without_review_model_policy'
          cargo nextest run -p codex-core 'guardian_review_session_config_clears_context_overrides_for_distinct_effective_model'
          cargo nextest run -p codex-core 'guardian_review_session_config_preserves_context_overrides_for_same_effective_model'

      - name: Lint affected crates
        run: |
          just clippy -p codex-model-provider -- -D warnings
          just clippy -p codex-config -- -D warnings
          just clippy -p codex-memories-write -- -D warnings
          just clippy -p codex-guardian-v2 -- -D warnings
          cargo clippy -p codex-core --lib -- -D warnings
