name: C1c Facts diagnostic

on:
  push:
    branches: ["codex/grok-0.158-c1-harness"]

permissions:
  contents: read

jobs:
  facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GROK_FACTS: "0"
      GROK_LIVE: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: grok/go.mod
          cache: false
      - name: Identify the diagnostic subject
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "subject=$GITHUB_SHA" "workflow=$GITHUB_WORKFLOW_SHA"
      - name: Test the public HTTP seam without backend calls
        working-directory: grok
        run: go test -race -count=1 -v ./facts
