name: grok-migration-207-check

on:
  push:
    branches:
      - work/grok-rust-v0.154.0-207

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Test Images API dialects
        run: cargo test -p codex-api endpoint::images::tests -- --nocapture
      - name: Test Grok provider image policy
        run: cargo test -p codex-model-provider grok_provider -- --nocapture
      - name: Test stock image generation extension
        run: cargo test -p codex-image-generation-extension -- --nocapture
