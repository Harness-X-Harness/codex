name: grokex-release

# One run is the evidence: resolve identities, reuse or build the six archives
# for the product tree, run every Live scenario against the Linux archive, then
# publish the immutable tag once and verify what was published.
#
# workflow_dispatch publishes (or rehearses with dry_run). The nightly schedule
# runs the same build and Live jobs in observation mode and never publishes.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, prove, and assemble without creating the tag or Release
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: grokex-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Resolve source, identity, and destination
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish: ${{ steps.mode.outputs.publish }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      upstream_tag: ${{ steps.identity.outputs.upstream_tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: identity
        run: python3 grokex/release.py identity --github-output >> "${GITHUB_OUTPUT}"
      - id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          UPSTREAM_TAG: ${{ steps.identity.outputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/release/${UPSTREAM_TAG}" ]]
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "mode=observation" >> "${GITHUB_OUTPUT}"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          elif [[ "${DRY_RUN}" == "true" ]]; then
            echo "mode=release" >> "${GITHUB_OUTPUT}"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=release" >> "${GITHUB_OUTPUT}"
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Verify public Grok profile
        run: python3 grokex/release.py verify-profile --path grokex/dist/config.toml.example
      - if: steps.mode.outputs.publish == 'true'
        name: Require an empty destination
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Destination tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Destination release ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

  build:
    name: Archives
    needs: preflight
    uses: ./.github/workflows/grokex-build.yml
    with:
      targets: '["aarch64-apple-darwin","x86_64-apple-darwin","aarch64-unknown-linux-musl","x86_64-unknown-linux-musl","aarch64-pc-windows-msvc","x86_64-pc-windows-msvc"]'

  live:
    name: Live ${{ matrix.scenario }} (${{ needs.preflight.outputs.mode }})
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario:
          - basic-exact-reply
          - encrypted-reasoning-tool-continuation
          - ultra-full-history-collaboration
          - image-generation-history-edit
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download the Linux archive for this product tree
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_TREE: ${{ needs.build.outputs.product_tree }}
        shell: bash
        run: |
          set -euo pipefail
          bash grokex/download-archives.sh "${PRODUCT_TREE}" archives x86_64-unknown-linux-musl
          python3 grokex/release.py verify-archives --dist archives --product-tree "${PRODUCT_TREE}" --target x86_64-unknown-linux-musl
      - name: Materialize and validate secret profile
        env:
          GROK_CONFIG_TOML: ${{ secrets.GROK_CONFIG_TOML }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GROK_CONFIG_TOML}" ]]
          umask 077
          printf '%s' "${GROK_CONFIG_TOML}" > "${RUNNER_TEMP}/config.toml"
          python3 grokex/release.py verify-profile --path "${RUNNER_TEMP}/config.toml" --secret
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: grokex/validator/go.mod
          cache-dependency-path: grokex/validator/go.sum
      - name: Build the validator
        working-directory: grokex/validator
        run: go build -o "${RUNNER_TEMP}/grokex-live" ./cmd/grokex-live
      - name: Execute the scenario
        env:
          MODE: ${{ needs.preflight.outputs.mode }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          SCENARIO: ${{ matrix.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/grokex-live" \
            --contracts grokex/live_contracts.json \
            --archive "archives/${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" \
            --config "${RUNNER_TEMP}/config.toml" \
            --evidence "${RUNNER_TEMP}/LIVE_EVIDENCE-${SCENARIO}.json" \
            --source-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --scenario "${SCENARIO}" \
            --mode "${MODE}"
      - name: Summarize secret-safe evidence
        if: always()
        env:
          SCENARIO: ${{ matrix.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/LIVE_EVIDENCE-${SCENARIO}.json"
          [[ -f "${evidence}" ]] || exit 0
          {
            echo "### ${SCENARIO}"
            echo
            jq -r '"- mode: \(.mode // "unknown")\n- outcome: \(.outcome // .status // "unknown")\n- last proven stage: \(.last_proven_stage // ((.stage_timings // [])[-1].stage) // "unknown")\n- turn durations (s): \((.turn_durations_seconds // []) | map(tostring) | join(", "))"' "${evidence}"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: grokex-live-evidence-${{ matrix.scenario }}
          path: ${{ runner.temp }}/LIVE_EVIDENCE-${{ matrix.scenario }}.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Assemble, publish once, verify
    needs: [preflight, build, live]
    if: needs.preflight.outputs.mode == 'release'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      PRODUCT_TREE: ${{ needs.build.outputs.product_tree }}
      PUBLISH: ${{ needs.preflight.outputs.publish }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download the six archives for this product tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash grokex/download-archives.sh "${PRODUCT_TREE}" archives \
            aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl \
            x86_64-unknown-linux-musl aarch64-pc-windows-msvc x86_64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: grokex-live-evidence-*
          path: evidence-download
          merge-multiple: true
      - name: Assemble and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          find evidence-download -name 'LIVE_EVIDENCE-*.json' -type f -exec cp {} evidence/ \;
          python3 grokex/release.py assemble \
            --archives archives \
            --evidence-dir evidence \
            --output release-assets \
            --repository . \
            --source-sha "${GITHUB_SHA}" \
            --product-tree "${PRODUCT_TREE}" \
            --release-run "${GITHUB_RUN_ID}"
          python3 grokex/release.py verify-assets \
            --dist release-assets \
            --source-sha "${GITHUB_SHA}" \
            --product-tree "${PRODUCT_TREE}" \
            --release-run "${GITHUB_RUN_ID}"
          {
            echo "## ${RELEASE_TAG} (publish=${PUBLISH})"
            echo
            sed 's/^/    /' release-assets/RELEASE.json
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grokex-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 30
      - if: env.PUBLISH == 'true'
        name: Recheck the destination and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.preflight.outputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/release/${UPSTREAM_TAG}" --jq .object.sha)"
          [[ "${branch_sha}" == "${GITHUB_SHA}" ]]
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Destination tag appeared during validation" >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Grokex ${VERSION}" \
            --notes "Stock Codex ${VERSION} harness with the release-bundled grok-4.6 Provider catalog."
      - if: env.PUBLISH == 'true'
        name: Download and verify the published destination
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "${GITHUB_SHA}" ]]
          mkdir published
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir published
          python3 grokex/release.py verify-assets \
            --dist published \
            --source-sha "${GITHUB_SHA}" \
            --product-tree "${PRODUCT_TREE}" \
            --release-run "${GITHUB_RUN_ID}"
