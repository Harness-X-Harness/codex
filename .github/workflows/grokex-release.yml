name: grokex-release

# Build six archives, run llm-go Grok Live against the Linux archive, then
# optionally publish the tag. workflow_dispatch publishes (or rehearses with
# dry_run). The nightly schedule runs build and Live and never publishes.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and prove without creating the tag or Release
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: grokex-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Resolve branch version and destination
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: identity
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          prefix="release/rust-v"
          [[ "${GITHUB_REF}" == "refs/heads/${prefix}"* ]]
          version="${ref#"${prefix}"}"
          [[ -n "${version}" && "${version}" != */* ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=grokex-v${version}" >> "${GITHUB_OUTPUT}"
      - id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${DRY_RUN}" == "true" ]]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Verify public Grok profile
        run: python3 grokex/release.py verify-profile --path grokex/dist/config.toml.example
      - if: steps.mode.outputs.publish == 'true'
        name: Require an empty destination
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Destination tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Destination release ${RELEASE_TAG} already exists" >&2
            exit 1
          fi

  build:
    name: Archives
    needs: preflight
    uses: ./.github/workflows/grokex-build.yml
    with:
      targets: '["aarch64-apple-darwin","x86_64-apple-darwin","aarch64-unknown-linux-musl","x86_64-unknown-linux-musl","aarch64-pc-windows-msvc","x86_64-pc-windows-msvc"]'

  live:
    name: llm-go Grok Live
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grokex-build-${{ github.sha }}-x86_64-unknown-linux-musl
          path: archives
      - name: Verify the Linux archive
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 grokex/release.py verify-archives \
            --dist archives \
            --version "${VERSION}" \
            --built-from-sha "${GITHUB_SHA}" \
            --target x86_64-unknown-linux-musl
      - name: Materialize and validate secret profile
        env:
          GROK_CONFIG_TOML: ${{ secrets.GROK_CONFIG_TOML }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GROK_CONFIG_TOML}" ]]
          umask 077
          printf '%s' "${GROK_CONFIG_TOML}" > "${RUNNER_TEMP}/config.toml"
          python3 grokex/release.py verify-profile --path "${RUNNER_TEMP}/config.toml" --secret
      - name: Extract the Codex binary
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          tar -xzf "archives/${RELEASE_TAG}-x86_64-unknown-linux-musl.tar.gz" -C extracted
          test -x "extracted/${RELEASE_TAG}/bin/grokex-bin"
          echo "GROKEX_LIVE_CODEX_BIN=${GITHUB_WORKSPACE}/extracted/${RELEASE_TAG}/bin/grokex-bin" >> "${GITHUB_ENV}"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ronhuafeng/llm-go
          ref: 9b72c486c516e21a7b1895c412f2203e231c2840
          path: llm-go
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: llm-go/codexsdk/go.mod
          cache-dependency-path: llm-go/codexsdk/go.sum
      - name: Run Grok Live tests
        working-directory: llm-go/codexsdk
        env:
          GROKEX_LIVE: "1"
          GROKEX_LIVE_CONFIG: ${{ runner.temp }}/config.toml
        run: |
          set -euo pipefail
          test -x "${GROKEX_LIVE_CODEX_BIN}"
          go test . -count=1 -timeout 30m -run '^TestGrok'

  publish:
    name: Checksums and publish once
    needs: [preflight, build, live]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: grokex-build-${{ github.sha }}-*
          path: archive-download
          merge-multiple: true
      - name: Stage archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find archive-download -name '*.tar.gz' -type f -exec cp {} release-assets/ \;
          python3 grokex/release.py verify-archives \
            --dist release-assets \
            --version "${VERSION}" \
            --built-from-sha "${GITHUB_SHA}"
          python3 grokex/release.py checksums --dist release-assets
          cp grokex/dist/config.toml.example grokex/dist/install-grokex.sh grokex/dist/install-grokex.ps1 release-assets/
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grokex-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 30
      - name: Recheck the destination and publish once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)"
          [[ "${branch_sha}" == "${GITHUB_SHA}" ]]
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Destination tag appeared during validation" >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Grokex ${VERSION}" \
            --notes "Stock Codex ${VERSION} harness with the release-bundled grok-4.6 Provider catalog."
      - name: Download and verify the published destination
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "${GITHUB_SHA}" ]]
          mkdir published
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir published
          python3 grokex/release.py verify-archives \
            --dist published \
            --version "${VERSION}" \
            --built-from-sha "${GITHUB_SHA}"
