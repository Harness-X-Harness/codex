# Keep the registered workflow path so this temporary carrier is dispatchable.
name: grokex-final-six-build

on:
  workflow_dispatch:

concurrency:
  group: grokex-v0.149.0-final-six-build
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  PRODUCT_SHA: c73cad12654097e4f7256a5d5f63e606da4774e5
  PUBLISHED_SHA: 2e400c0abe1b66fccd8d194f50b384407125dfc5
  SOURCE_BRANCH: release/rust-v0.149.0
  VALIDATION_BRANCH: codex/issue-113-final-six-build-carrier
  RELEASE_TAG: grokex-v0.149.0
  UPSTREAM_COMMIT: 758ef40f50c1a458425c7cfbf1eb12cbc07af0b0

jobs:
  preflight:
    name: Freeze final source and validation carrier
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      validator_sha: ${{ steps.source.outputs.validator_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Verify exact source, carrier, and unchanged destination
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/${VALIDATION_BRANCH}" ]]
          carrier_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${VALIDATION_BRANCH}" --jq .object.sha)"
          [[ "${GITHUB_SHA}" == "${carrier_sha}" ]]
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${SOURCE_BRANCH}" --jq .object.sha)"
          [[ "${source_sha}" == "${PRODUCT_SHA}" ]]
          git merge-base --is-ancestor "${UPSTREAM_COMMIT}" "${PRODUCT_SHA}"
          git merge-base --is-ancestor "${PRODUCT_SHA}" "${GITHUB_SHA}"
          [[ "$(<grokex/codex-release-tag)" == "rust-v0.149.0" ]]
          mapfile -t changed_paths < <(git diff --name-only "${PRODUCT_SHA}...${GITHUB_SHA}")
          printf '%s\n' "${changed_paths[@]}" | diff -u - <(printf '%s\n' \
            .github/workflows/grokex-release.yml \
            codex-rs/core/tests/suite/agent_execution.rs)
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          [[ "${tag_sha}" == "${PUBLISHED_SHA}" ]]
          release_target="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish)"
          [[ "${release_target}" == "${PUBLISHED_SHA}" ]]
          {
            echo "sha=${PRODUCT_SHA}"
            echo "validator_sha=${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"
      - name: Verify public Grok profile
        run: python3 grokex/release.py verify-profile --path grokex/config.toml.example

  checks:
    name: Deterministic release gates
    needs: preflight
    uses: ./.github/workflows/grokex-checks.yml
    with:
      source_sha: ${{ needs.preflight.outputs.validator_sha }}

  build_candidate:
    name: Build x86_64-unknown-linux-musl candidate
    needs: [preflight, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-grokex
        with:
          target: x86_64-unknown-linux-musl

  package_candidate:
    name: Package final Linux x86_64 candidate
    needs: [preflight, build_candidate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raw-x86_64-unknown-linux-musl
          path: raw
      - name: Normalize candidate artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw/x86_64-unknown-linux-musl
          find raw -maxdepth 1 -type f -exec mv {} raw/x86_64-unknown-linux-musl/ \;
      - name: Build and verify candidate archive
        run: |
          python3 grokex/release.py package \
            --raw-root raw \
            --output archives \
            --repository . \
            --source-sha "${{ needs.preflight.outputs.source_sha }}" \
            --target x86_64-unknown-linux-musl
          python3 grokex/release.py verify-archives \
            --dist archives \
            --source-sha "${{ needs.preflight.outputs.source_sha }}" \
            --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grokex-linux-candidate
          path: archives
          if-no-files-found: error
          retention-days: 1

  build_remaining:
    name: Build ${{ matrix.target }}
    needs: [preflight, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-grokex
        with:
          target: ${{ matrix.target }}

  package:
    name: Assemble and verify exact six archives
    needs: [preflight, package_candidate, build_remaining]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grokex-linux-candidate
          path: archives
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: raw-*
          path: raw
      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          for directory in raw/raw-*; do
            target="${directory#raw/raw-}"
            mv "${directory}" "raw/${target}"
          done
      - name: Build remaining archives and verify exact six
        run: |
          python3 grokex/release.py package \
            --raw-root raw \
            --output archives \
            --repository . \
            --source-sha "${{ needs.preflight.outputs.source_sha }}" \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin \
            --target aarch64-unknown-linux-musl \
            --target aarch64-pc-windows-msvc \
            --target x86_64-pc-windows-msvc
          python3 grokex/release.py verify-archives \
            --dist archives \
            --source-sha "${{ needs.preflight.outputs.source_sha }}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grokex-archives
          path: archives
          if-no-files-found: error
          retention-days: 7
