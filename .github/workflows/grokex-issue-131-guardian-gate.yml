name: Grokex Issue 131 Guardian gate

on:
  pull_request:
    branches:
      - codex/issue-131-guardian-provider-gate

permissions:
  contents: read

jobs:
  guardian-provider-gate:
    runs-on: ubuntu-24.04
    env:
      RUST_MIN_STACK: 16777216
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify product parent
        working-directory: .
        env:
          EXPECTED_PRODUCT_SHA: ea442b38f8a2200986a0e48b378cd4b00fcfecab
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_PRODUCT_SHA"
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy,rustfmt
      - name: Capture authoritative formatting
        run: |
          cargo fmt -- --config imports_granularity=Item
          git diff --binary -- . > "$RUNNER_TEMP/issue-131.patch"
          git status --short -- . > "$RUNNER_TEMP/issue-131.status"
      - name: Existing stock Guardian contracts
        run: cargo test -p codex-guardian-v2
      - name: Guardian library lints
        run: cargo clippy -p codex-guardian-v2 --lib -- -D warnings
      - name: Upload formatter authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-131-guardian-authority
          path: |
            ${{ runner.temp }}/issue-131.patch
            ${{ runner.temp }}/issue-131.status
          if-no-files-found: error
