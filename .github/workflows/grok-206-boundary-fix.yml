name: grok-206-boundary-fix

on:
  push:
    branches:
      - work/grok-rust-v0.154.0-206

permissions:
  contents: write

jobs:
  fix-boundary:
    if: ${{ contains(github.event.head_commit.message, '[206-boundary-fix-request]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - name: Move X Search to Grok API boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_one(
              "codex-rs/model-provider/src/provider.rs",
              "    pub web_search: bool,\n    pub x_search: bool,\n    pub external_web_access: bool,\n",
              "    pub web_search: bool,\n    pub external_web_access: bool,\n",
          )
          replace_one(
              "codex-rs/model-provider/src/provider.rs",
              "            web_search: true,\n            x_search: false,\n            external_web_access: true,\n",
              "            web_search: true,\n            external_web_access: true,\n",
          )
          replace_one(
              "codex-rs/model-provider/src/grok_provider.rs",
              "            web_search: true,\n            x_search: true,\n            external_web_access: true,\n",
              "            web_search: true,\n            external_web_access: true,\n",
          )
          replace_one(
              "codex-rs/model-provider/src/grok_provider_tests.rs",
              "    assert!(capabilities.web_search);\n    assert!(capabilities.x_search);\n    assert!(capabilities.external_web_access);\n",
              "    assert!(capabilities.web_search);\n    assert!(capabilities.external_web_access);\n",
          )
          replace_one(
              "codex-rs/tools/src/tool_spec.rs",
              "    #[serde(rename = \"x_search\")]\n    XSearch,\n",
              "",
          )
          replace_one(
              "codex-rs/tools/src/tool_spec.rs",
              "            ToolSpec::WebSearch { .. } => \"web_search\",\n            ToolSpec::XSearch => \"x_search\",\n            ToolSpec::Freeform(tool) => tool.name.as_str(),\n",
              "            ToolSpec::WebSearch { .. } => \"web_search\",\n            ToolSpec::Freeform(tool) => tool.name.as_str(),\n",
          )
          replace_one(
              "codex-rs/core/src/tools/spec_plan.rs",
              "    if turn_context.provider.capabilities().x_search {\n        specs.push(ToolSpec::XSearch);\n    }\n",
              "",
          )
          replace_one(
              "codex-rs/core/src/tools/spec_plan.rs",
              "            ToolSpec::Namespace(_)\n            | ToolSpec::ToolSearch { .. }\n            | ToolSpec::WebSearch { .. }\n            | ToolSpec::XSearch => {\n",
              "            ToolSpec::Namespace(_)\n            | ToolSpec::ToolSearch { .. }\n            | ToolSpec::WebSearch { .. } => {\n",
          )
          replace_one(
              "codex-rs/core/src/tools/router.rs",
              "                ToolSpec::ToolSearch { .. } | ToolSpec::WebSearch { .. } | ToolSpec::XSearch => {\n                    false\n                }\n",
              "                ToolSpec::ToolSearch { .. } | ToolSpec::WebSearch { .. } => false,\n",
          )

          old = '''            // Grok's verified no-tool request omits the tool-control trio entirely.\n            // Non-empty tool projection is owned by #206.\n            let has_no_tools = match object.get("tools") {\n                None => true,\n                Some(tools) => tools.as_array().is_some_and(Vec::is_empty),\n            };\n            if has_no_tools {\n                object.remove("tools");\n                object.remove("tool_choice");\n                object.remove("parallel_tool_calls");\n            } else if let Some(tools) = object.get_mut("tools").and_then(Value::as_array_mut) {\n                for tool in tools {\n                    if tool.get("type").and_then(Value::as_str) == Some("web_search") {\n                        *tool = serde_json::json!({ "type": "web_search" });\n                    }\n                }\n            }\n'''
          new = '''            // X Search is a Grok wire-only hosted tool. Keep it out of canonical\n            // ToolSpec/ProviderCapabilities so stock providers and durable state do not know it.\n            let tools = object\n                .entry("tools".to_string())\n                .or_insert_with(|| Value::Array(Vec::new()))\n                .as_array_mut()\n                .ok_or_else(|| {\n                    <serde_json::Error as serde::ser::Error>::custom(\n                        "Grok request tools must serialize as an array",\n                    )\n                })?;\n            for tool in tools.iter_mut() {\n                if tool.get("type").and_then(Value::as_str) == Some("web_search") {\n                    *tool = serde_json::json!({ "type": "web_search" });\n                }\n            }\n            if !tools\n                .iter()\n                .any(|tool| tool.get("type").and_then(Value::as_str) == Some("x_search"))\n            {\n                tools.push(serde_json::json!({ "type": "x_search" }));\n            }\n'''
          replace_one("codex-rs/codex-api/src/provider.rs", old, new)

          replace_one(
              "codex-rs/codex-api/src/provider_grok_tests.rs",
              '''    assert!(projected.get("tools").is_none());\n    assert!(projected.get("tool_choice").is_none());\n    assert!(projected.get("parallel_tool_calls").is_none());\n''',
              '''    assert_eq!(projected["tools"], json!([{"type":"x_search"}]));\n    assert_eq!(projected["tool_choice"], "auto");\n    assert_eq!(projected["parallel_tool_calls"], true);\n''',
          )
          replace_one(
              "codex-rs/codex-api/src/provider_grok_tests.rs",
              '''        {\n            "type": "web_search",\n            "external_web_access": true,\n            "indexed_web_access": true,\n            "search_context_size": "medium"\n        },\n        {"type": "x_search"}\n''',
              '''        {\n            "type": "web_search",\n            "external_web_access": true,\n            "indexed_web_access": true,\n            "search_context_size": "medium"\n        }\n''',
          )

          # The canonical model/tool layers must no longer contain a Grok X Search type or field.
          forbidden = []
          for path in Path("codex-rs").rglob("*.rs"):
              text = path.read_text()
              if "ToolSpec::XSearch" in text or "pub x_search:" in text or "capabilities.x_search" in text:
                  forbidden.append(str(path))
          if forbidden:
              raise SystemExit("Grok X Search leaked into canonical/shared layers: " + ", ".join(forbidden))
          PY
          cd codex-rs
          cargo fmt -- --config imports_granularity=Item
          cargo test -p codex-api provider::grok_tests -- --nocapture
          cargo test -p codex-model-provider grok_provider -- --nocapture
          cargo test -p codex-core tools::router::grok_tests -- --nocapture
          cargo test -p codex-core tools::handlers::apply_patch_tests -- --nocapture
          cd ..
          git diff --check
      - name: Commit boundary correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codex-rs
          git commit -m "fix(grok): keep X Search at provider wire boundary [206-boundary-fix]"
          git push origin HEAD:work/grok-rust-v0.154.0-206
