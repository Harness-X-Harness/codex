name: grokex-build

# Build Grokex archives from this commit. Packaging is independent from
# Rust/llm-go correctness. Version comes from the grok/rust-v* branch name.

on:
  push:
    branches: ['grok/**']
  workflow_call:
    inputs:
      targets:
        description: JSON array of Rust target triples to build
        required: true
        type: string
    outputs:
      version:
        description: Dotted version from the grok/rust-v* branch name
        value: ${{ jobs.identity.outputs.version }}
      release_tag:
        description: Archive tag grokex-vVERSION
        value: ${{ jobs.identity.outputs.release_tag }}

permissions:
  actions: read
  contents: read

jobs:
  identity:
    name: Resolve packaging version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: identity
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          prefix="grok/rust-v"
          if [[ "${ref}" != "${prefix}"* ]]; then
            echo "packaging version comes from branch ${prefix}*" >&2
            exit 1
          fi
          version="${ref#"${prefix}"}"
          [[ -n "${version}" && "${version}" != */* ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=grokex-v${version}" >> "${GITHUB_OUTPUT}"
      - id: matrix
        name: Pair each requested target with its native runner
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED}" ]]; then
            targets="${REQUESTED}"
          else
            targets='["x86_64-unknown-linux-musl"]'
          fi
          runners='{
            "aarch64-apple-darwin": "macos-15",
            "x86_64-apple-darwin": "macos-15-intel",
            "aarch64-unknown-linux-musl": "ubuntu-24.04-arm",
            "x86_64-unknown-linux-musl": "ubuntu-24.04",
            "aarch64-pc-windows-msvc": "windows-11-arm",
            "x86_64-pc-windows-msvc": "windows-2025"
          }'
          matrix="$(jq -c --argjson runners "${runners}" '
            if type != "array" or length == 0 then error("targets must be a non-empty array") else . end
            | map({target: ., runner: ($runners[.] // error("no runner for target \(.)"))})
          ' <<<"${targets}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.identity.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 170
    env:
      ARTIFACT: grokex-build-${{ github.sha }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-grokex
        with:
          target: ${{ matrix.target }}
      - name: Package the archive for this target
        env:
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          "${PYTHON}" grokex/release.py package \
            --raw-root "${RUNNER_TEMP}/raw" \
            --output "${RUNNER_TEMP}/archive" \
            --repository . \
            --version "${VERSION}" \
            --built-from-sha "${GITHUB_SHA}" \
            --target "${TARGET}"
          "${PYTHON}" grokex/release.py verify-archives \
            --dist "${RUNNER_TEMP}/archive" \
            --version "${VERSION}" \
            --built-from-sha "${GITHUB_SHA}" \
            --target "${TARGET}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/archive
          if-no-files-found: error
          retention-days: 90
