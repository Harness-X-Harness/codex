name: grok-facts

# Independent observations. Required native proof remains in grok-proof.yml.
on:
  push:
    branches: ["grok/rust-v*"]
    paths:
      - "grok/facts/**"
      - "grok/tests/facts/**"
      - "grok/cmd/grok-facts/**"
      - "grok/internal/providerfixture/**"
      - "grok/internal/scenarios/**"
      - "grok/cmd/grok-scenarios/**"
      - "grok/dist/**"
      - "grok/go.mod"
      - "grok/go.sum"
      - ".github/workflows/grok-facts.yml"
  workflow_dispatch:
    inputs:
      scenario:
        description: One existing observation to execute once.
        type: string
        required: true
        default: basic-primary

permissions:
  contents: read

# Retain each requested observation; a later invocation does not cancel it.
concurrency:
  group: grok-facts-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  selection:
    name: Select independent Facts observations
    if: ${{ github.repository == 'Harness-X-Harness/codex' && startsWith(github.ref, 'refs/heads/grok/rust-v') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.GROK_FACTS == '1')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scenarios: ${{ steps.catalog.outputs.scenarios }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: grok/go.mod
          cache: true
          cache-dependency-path: grok/go.sum
      - name: Read the Go-owned Facts selection
        id: catalog
        working-directory: grok
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          args=(--family facts --suite full)
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            args=(--family facts --suite diagnostic --scenario "$SCENARIO")
          fi
          scenarios="$(go run ./cmd/grok-scenarios "${args[@]}")"
          printf 'scenarios=%s\n' "$scenarios" >> "$GITHUB_OUTPUT"

  facts:
    name: Facts (${{ matrix.scenario }})
    needs: selection
    if: ${{ github.repository == 'Harness-X-Harness/codex' && startsWith(github.ref, 'refs/heads/grok/rust-v') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.GROK_FACTS == '1')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: ${{ fromJSON(needs.selection.outputs.scenarios || '[]') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Record the exact observation subject
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code "$GITHUB_WORKFLOW_SHA" HEAD -- .github/workflows/grok-facts.yml
          mkdir "$RUNNER_TEMP/facts-evidence"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          fields = ("GITHUB_REPOSITORY", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_EVENT_NAME",
                    "GITHUB_REF", "GITHUB_SHA", "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA", "SCENARIO")
          subject = {key: os.environ[key] for key in fields}
          (Path(os.environ["RUNNER_TEMP"]) / "facts-evidence/subject.json").write_text(json.dumps(subject, sort_keys=True) + "\n")
          PY
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: grok/go.mod
          cache: false
      - name: Execute the selected Go-native backend observation once
        working-directory: grok
        env:
          GROK_FACTS: "1"
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          owner="$(go run ./cmd/grok-scenarios --family facts --suite diagnostic \
            --scenario "$SCENARIO" --test-owners | python3 -c 'import json,sys; owners=json.load(sys.stdin); assert len(owners)==1; print(owners[0])')"
          status=0
          go test -tags=facts -count=1 -timeout=8m -json ./tests/facts -args \
            -grok-facts-suite diagnostic -grok-facts-scenario "$SCENARIO" \
            > "$RUNNER_TEMP/facts-evidence/tests.json" || status=$?
          go run ./cmd/grok-test-results --input "$RUNNER_TEMP/facts-evidence/tests.json" \
            --require "$owner" > "$RUNNER_TEMP/facts-evidence/summary.json" || status=1
          cat "$RUNNER_TEMP/facts-evidence/summary.json"
          exit "$status"
      - name: Retain bounded observation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grok-facts-${{ matrix.scenario }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/facts-evidence
          if-no-files-found: warn
          retention-days: 30
