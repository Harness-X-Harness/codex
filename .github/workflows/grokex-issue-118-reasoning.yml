name: Grokex Issue 118 reasoning

on:
  pull_request:
    branches:
      - codex/issue-118-reasoning-projection

permissions:
  contents: read

jobs:
  reasoning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify product parent
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "98a0b94d8267298294f48f9d02bc804db7d7ee80"

      - name: Prepare Linux Cargo environment
        uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-nextest

      - name: Apply authoritative formatting and capture the complete diff
        shell: bash
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo fmt -- --config imports_granularity=Item
          cd ..
          git diff --binary > "${RUNNER_TEMP}/issue-118-authority.patch"
          git status --short > "${RUNNER_TEMP}/issue-118-authority-status.txt"

      - name: Upload authoritative mechanical changes
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: issue-118-authority
          path: |
            ${{ runner.temp }}/issue-118-authority.patch
            ${{ runner.temp }}/issue-118-authority-status.txt

      - name: Test Provider reasoning contracts
        working-directory: codex-rs
        run: just test -p codex-model-provider

      - name: Test stock and Grok request projection contracts
        working-directory: codex-rs
        run: |
          just test -p codex-core ultra_reasoning_uses_max_and_proactive_mode
          just test -p codex-core grok_ultra_reasoning_uses_xhigh

      - name: Test Guardian request projection boundary
        working-directory: codex-rs
        run: >-
          just test -p codex-guardian-v2
          preconnected_sampler_reuses_authenticated_websocket_for_structured_requests

      - name: Lint affected crates
        working-directory: codex-rs
        run: |
          just clippy -p codex-model-provider -- -D warnings
          cargo clippy -p codex-core --lib -- -D warnings
          cargo clippy -p codex-guardian-v2 --lib --tests -- -D warnings
