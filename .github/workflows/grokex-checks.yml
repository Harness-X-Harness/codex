name: grokex-checks

on:
  pull_request:
    branches: [release/rust-v0.151.0]
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:

concurrency:
  group: grokex-checks-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKOUT_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  helpers:
    name: Release helper contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - name: Install image decoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg imagemagick
      - name: Verify helper contracts
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null
          command -v convert >/dev/null
          python3 -m py_compile \
            grokex/release.py \
            grokex/live_smoke.py \
            grokex/test_release.py \
            grokex/test_live_smoke.py
          python3 -m unittest grokex.test_release grokex.test_live_smoke
          bash -n grokex/grokex grokex/install-grokex.sh
          pwsh -NoProfile -Command '[void][scriptblock]::Create((Get-Content -Raw grokex/grokex.ps1)); [void][scriptblock]::Create((Get-Content -Raw grokex/install-grokex.ps1))'
          python3 grokex/release.py verify-profile --path grokex/config.toml.example
          fixture="${RUNNER_TEMP}/grokex-fixture"
          mkdir -p "${fixture}/raw"
          for target in \
            aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-unknown-linux-musl x86_64-unknown-linux-musl \
            aarch64-pc-windows-msvc x86_64-pc-windows-msvc; do
            mkdir -p "${fixture}/raw/${target}"
            if [[ "${target}" == *windows* ]]; then
              touch "${fixture}/raw/${target}/codex.exe" "${fixture}/raw/${target}/codex-code-mode-host.exe"
            else
              touch "${fixture}/raw/${target}/codex" "${fixture}/raw/${target}/codex-code-mode-host"
            fi
            if [[ "${target}" == *linux* ]]; then
              touch "${fixture}/raw/${target}/bwrap"
            fi
          done
          python3 grokex/release.py package \
            --raw-root "${fixture}/raw" \
            --output "${fixture}/dist" \
            --repository . \
            --source-sha "${CHECKOUT_SHA}" \
            --target x86_64-unknown-linux-musl
          python3 grokex/release.py verify-archives \
            --dist "${fixture}/dist" \
            --source-sha "${CHECKOUT_SHA}" \
            --target x86_64-unknown-linux-musl
          candidate="${fixture}/dist/grokex-v0.151.0-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "${fixture}/extracted" "${fixture}/installed"
          tar -xzf "${candidate}" -C "${fixture}/extracted"
          GROKEX_BIN_DIR="${fixture}/installed/bin" \
            GROKEX_HOME="${fixture}/installed/home" \
            sh "${fixture}/extracted/grokex-v0.151.0/install-grokex.sh"
          test -x "${fixture}/installed/bin/bwrap"
          candidate_sha="$(sha256sum "${candidate}" | awk '{print $1}')"
          python3 grokex/release.py package \
            --raw-root "${fixture}/raw" \
            --output "${fixture}/dist" \
            --repository . \
            --source-sha "${CHECKOUT_SHA}" \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin \
            --target aarch64-unknown-linux-musl \
            --target aarch64-pc-windows-msvc \
            --target x86_64-pc-windows-msvc
          [[ "$(sha256sum "${candidate}" | awk '{print $1}')" == "${candidate_sha}" ]]
          python3 grokex/release.py verify-archives \
            --dist "${fixture}/dist" \
            --source-sha "${CHECKOUT_SHA}"

  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt -- --config imports_granularity=Item --check

  contracts:
    name: Stock and Grok contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - id: provider
        name: Provider contracts
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_exact() {
            package="$1"
            test_name="$2"
            shift 2
            output="$(mktemp)"
            cargo test -p "${package}" "$@" "${test_name}" -- --exact | tee "${output}"
            grep -Eq 'test result: ok\. 1 passed; 0 failed;' "${output}" || {
              echo "exact selector did not execute one test: ${test_name}" >&2
              exit 1
            }
          }
          for test_name in \
            grok_provider::tests::grok_projects_only_plaintext_agent_message_on_request_copy \
            grok_provider::tests::grok_provider_projects_text_and_tool_continuation \
            grok_provider::tests::grok_provider_replays_encrypted_reasoning_without_null_content \
            grok_provider::tests::grok_recognizes_only_completed_provider_hosted_x_calls \
            grok_provider::tests::resolved_provider_derives_internal_responses_dialect \
            grok_provider::tests::grok_models_manager_uses_bundle_or_exact_config_replacement; do
            run_exact codex-model-provider "${test_name}" --lib
          done
          run_exact codex-model-provider provider::tests::configured_provider_uses_stock_background_models --lib
          run_exact codex-model-provider-info tests::test_grok_wire_api_is_not_openai_by_name --lib
          run_exact codex-model-provider-info tests::test_validate_grok_provider_rejects_websockets --lib
          run_exact codex-api provider::tests::grok_projects_verified_live_web_search_to_bare_declaration --lib
          run_exact codex-api provider::tests::grok_rejects_unverified_web_search_declarations --lib
          run_exact codex-api provider::tests::grok_rejects_residual_agent_message_before_transport --lib
          run_exact codex-api grok_no_tool_request_omits_tool_controls --test clients
      - id: projections
        name: Stock App Server Provider projections
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_exact() {
            test_name="$1"
            output="$(mktemp)"
            cargo test -p codex-app-server --test all "${test_name}" -- --exact | tee "${output}"
            grep -Eq 'test result: ok\. 1 passed; 0 failed;' "${output}" || {
              echo "exact selector did not execute one test: ${test_name}" >&2
              exit 1
            }
          }
          run_exact suite::v2::model_list::list_models_uses_grok_release_catalog_through_stock_model_dto
          run_exact suite::v2::model_provider_capabilities_read::read_grok_provider_capabilities
      - id: controls
        name: Shared stock seam controls
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_exact() {
            package="$1"
            test_name="$2"
            shift 2
            output="$(mktemp)"
            cargo test -p "${package}" "$@" "${test_name}" -- --exact | tee "${output}"
            grep -Eq 'test result: ok\. 1 passed; 0 failed;' "${output}" || {
              echo "exact selector did not execute one test: ${test_name}" >&2
              exit 1
            }
          }
          run_exact codex-core tools::router::tests::flat_projection_disambiguates_retained_indirect_guidance --lib
          run_exact codex-core tools::router::tests::flat_projection_round_trips_same_local_names_across_namespaces --lib
          run_exact codex-core tools::router::tests::flat_projection_replays_custom_call_with_matching_output --lib
          run_exact codex-core tools::router::tests::flat_projection_marks_only_plaintext_collaboration_calls --lib
          run_exact codex-core guardian::tests::guardian_review_session_config_rejects_provider_without_review_model_policy --lib
          run_exact codex-guardian-v2 async_scorer::extension::tests::installed_extension_skips_provider_without_reviewer_model_policy --lib
          run_exact codex-guardian-v2 sync_reviewer::reviewer_config::tests::rejects_provider_without_reviewer_model_policy --lib
          run_exact codex-memories-write startup_tests::memories_without_provider_model_policy_do_not_egress --lib
          run_exact codex-config thread_config::remote::tests::model_provider_proto_round_trips_grok_wire_api --lib
          run_exact codex-app-server suite::v2::mcp_tool::mcp_server_tool_call_returns_tool_result --test all
      - id: grok
        name: Grok metadata-driven V2, Ultra, and hosted X Search
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_exact() {
            package="$1"
            test_name="$2"
            shift 2
            output="$(mktemp)"
            cargo test -p "${package}" "$@" "${test_name}" -- --exact | tee "${output}"
            grep -Eq 'test result: ok\. 1 passed; 0 failed;' "${output}" || {
              echo "exact selector did not execute one test: ${test_name}" >&2
              exit 1
            }
          }
          run_exact codex-core suite::agent_execution::grok_ultra_v2_full_history_is_gateway_compatible --test all
          run_exact codex-history tests::provider_hosted_tool_metadata_round_trips_beside_rollout_payload --lib
          run_exact codex-core context_manager::history::tests::normalize_keeps_provider_hosted_custom_tool_call_without_output --lib
          run_exact codex-core suite::web_search::grok_web_search_uses_bare_live_declaration_and_replays_stock_history --test all
          run_exact codex-core suite::x_search::grok_x_search_is_provider_hosted_and_replays_canonical_history --test all
          run_exact codex-api endpoint::images::tests::generate_posts_typed_request_and_parses_image_response --lib
          run_exact codex-api endpoint::images::tests::edit_posts_typed_request_and_parses_image_response --lib
          run_exact codex-api endpoint::images::tests::grok_edit_projects_single_and_multiple_image_shapes --lib
          run_exact codex-api endpoint::images::tests::grok_edit_rejects_unsupported_cardinality_before_transport --lib
          run_exact codex-image-generation-extension tool::tests::recent_image_fallback_selects_newest_images_in_chronological_order --lib
          run_exact codex-app-server suite::v2::imagegen_extension::grok_imagegen_extension::grok_image_generation_then_history_edit_uses_stock_lifecycle --test all
      - name: Require every contract group
        if: always()
        env:
          CONTROLS: ${{ steps.controls.outcome }}
          GROK: ${{ steps.grok.outcome }}
          PROJECTIONS: ${{ steps.projections.outcome }}
          PROVIDER: ${{ steps.provider.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failures=()
          [[ "${PROVIDER}" == "success" ]] || failures+=("Provider contracts")
          [[ "${PROJECTIONS}" == "success" ]] || failures+=("stock Provider projections")
          [[ "${CONTROLS}" == "success" ]] || failures+=("stock controls")
          [[ "${GROK}" == "success" ]] || failures+=("Grok contracts")
          if (( ${#failures[@]} )); then
            printf 'Failed contract group: %s\n' "${failures[@]}" >&2
            exit 1
          fi

  lints:
    name: Affected library lints
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - name: Lint affected libraries
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p codex-api -p codex-config -p codex-guardian-v2 -p codex-image-generation-extension -p codex-memories-write -p codex-model-provider -p codex-model-provider-info -p codex-tools -p codex-history -p codex-core --lib -- -D warnings
          cargo clippy -p codex-core --test all -- -D warnings
          cargo clippy -p codex-app-server --test all -- -D warnings

  require:
    name: Require every deterministic gate
    needs: [helpers, formatting, contracts, lints]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require success
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          FORMATTING: ${{ needs.formatting.result }}
          HELPERS: ${{ needs.helpers.result }}
          LINTS: ${{ needs.lints.result }}
        shell: bash
        run: |
          set -euo pipefail
          failures=()
          [[ "${HELPERS}" == "success" ]] || failures+=("release helpers")
          [[ "${FORMATTING}" == "success" ]] || failures+=("formatting")
          [[ "${CONTRACTS}" == "success" ]] || failures+=("contracts")
          [[ "${LINTS}" == "success" ]] || failures+=("lints")
          if (( ${#failures[@]} )); then
            printf 'Failed deterministic gate: %s\n' "${failures[@]}" >&2
            exit 1
          fi
