name: grok-checks

# Product checks: rustfmt, clippy, native Rust contracts.
# Packaging readiness: release.py packaging tests, shell syntax, actionlint.

on:
  pull_request:
    branches: ['grok/**']
  workflow_dispatch:

concurrency:
  group: grok-checks-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - run: cargo fmt -- --config imports_granularity=Item --check

  contracts:
    name: Stock and Grok contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: codex-rs
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - id: provider
        name: Provider contracts
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_cargo() {
            output="$(mktemp)"
            cargo test "$@" | tee "${output}"
            grep -Eq 'test result: ok\.' "${output}" || {
              echo "cargo test failed: $*" >&2
              exit 1
            }
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "${output}" || {
              echo "cargo test executed 0 tests: $*" >&2
              exit 1
            }
          }
          run_cargo -p codex-model-provider -p codex-model-provider-info -p codex-api
      - id: projections
        name: Stock App Server Provider projections
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_cargo() {
            output="$(mktemp)"
            cargo test "$@" | tee "${output}"
            grep -Eq 'test result: ok\.' "${output}" || {
              echo "cargo test failed: $*" >&2
              exit 1
            }
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "${output}" || {
              echo "cargo test executed 0 tests: $*" >&2
              exit 1
            }
          }
          run_cargo -p codex-app-server --test all grok
      - id: controls
        name: Shared stock seam controls
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_cargo() {
            output="$(mktemp)"
            cargo test "$@" | tee "${output}"
            grep -Eq 'test result: ok\.' "${output}" || {
              echo "cargo test failed: $*" >&2
              exit 1
            }
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "${output}" || {
              echo "cargo test executed 0 tests: $*" >&2
              exit 1
            }
          }
          run_cargo -p codex-core --lib grok
          run_cargo -p codex-core --lib review_model_policy
          run_cargo -p codex-guardian-v2 -p codex-memories-write --lib
          run_cargo -p codex-config --lib grok
          run_cargo -p codex-app-server --test all mcp_server_tool_call_returns_tool_result
      - id: grok
        name: Grok metadata-driven V2, Ultra, and hosted X Search
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          run_cargo() {
            output="$(mktemp)"
            cargo test "$@" | tee "${output}"
            grep -Eq 'test result: ok\.' "${output}" || {
              echo "cargo test failed: $*" >&2
              exit 1
            }
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "${output}" || {
              echo "cargo test executed 0 tests: $*" >&2
              exit 1
            }
          }
          run_cargo -p codex-core --test all grok
          run_cargo -p codex-history --lib
          run_cargo -p codex-core --lib provider_hosted_custom_tool_call
          run_cargo -p codex-image-generation-extension --lib
      - name: Require every contract group
        if: always()
        env:
          CONTROLS: ${{ steps.controls.outcome }}
          GROK: ${{ steps.grok.outcome }}
          PROJECTIONS: ${{ steps.projections.outcome }}
          PROVIDER: ${{ steps.provider.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failures=()
          [[ "${PROVIDER}" == "success" ]] || failures+=("Provider contracts")
          [[ "${PROJECTIONS}" == "success" ]] || failures+=("stock Provider projections")
          [[ "${CONTROLS}" == "success" ]] || failures+=("stock controls")
          [[ "${GROK}" == "success" ]] || failures+=("Grok contracts")
          if (( ${#failures[@]} )); then
            printf 'Failed contract group: %s\n' "${failures[@]}" >&2
            exit 1
          fi

  lints:
    name: Affected library lints
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - name: Lint affected libraries
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p codex-api -p codex-config -p codex-guardian-v2 -p codex-image-generation-extension -p codex-memories-write -p codex-model-provider -p codex-model-provider-info -p codex-tools -p codex-history -p codex-core --lib -- -D warnings
          cargo clippy -p codex-core --test all -- -D warnings
          cargo clippy -p codex-app-server --test all -- -D warnings

  packaging:
    name: Packaging readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          persist-credentials: false
      - name: Lint the Grok workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "${ACTIONLINT_VERSION}" "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/actionlint" -shellcheck= -pyflakes= .github/workflows/grok-*.yml
      - name: Verify packaging helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile grok/release.py grok/test_release.py
          python3 -m unittest grok.test_release
          bash -n grok/dist/grok grok/dist/install-grok.sh
          pwsh -NoProfile -Command '[void][scriptblock]::Create((Get-Content -Raw grok/dist/grok.ps1)); [void][scriptblock]::Create((Get-Content -Raw grok/dist/install-grok.ps1))'

  require:
    name: Require every required gate
    needs: [formatting, contracts, lints, packaging]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require success
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          FORMATTING: ${{ needs.formatting.result }}
          LINTS: ${{ needs.lints.result }}
          PACKAGING: ${{ needs.packaging.result }}
        shell: bash
        run: |
          set -euo pipefail
          failures=()
          [[ "${FORMATTING}" == "success" ]] || failures+=("formatting")
          [[ "${CONTRACTS}" == "success" ]] || failures+=("contracts")
          [[ "${LINTS}" == "success" ]] || failures+=("lints")
          [[ "${PACKAGING}" == "success" ]] || failures+=("packaging")
          if (( ${#failures[@]} )); then
            printf 'Failed required gate: %s\n' "${failures[@]}" >&2
            exit 1
          fi
