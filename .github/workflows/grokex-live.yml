name: grokex-live

on:
  push:
    branches: [release/rust-v0.149.0]
    paths:
      - .github/workflows/grokex-live.yml
      - grokex/live_smoke.py
      - grokex/release.py
      - grokex/test_live_smoke.py
      - grokex/test_release.py
  workflow_call:
    inputs:
      archive_artifact:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      validator_sha:
        required: true
        type: string
    secrets:
      GROK_CONFIG_TOML:
        required: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable published Grokex tag to validate
        required: true
        default: grokex-v0.149.0
        type: string

concurrency:
  group: grokex-live-${{ inputs.source_sha || inputs.release_tag || github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Resolve one immutable Linux candidate
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      validator_sha: ${{ steps.resolve.outputs.validator_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.validator_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.archive_artifact != ''
        with:
          name: ${{ inputs.archive_artifact }}
          path: archives
      - id: resolve
        name: Verify artifact identity and provenance
        env:
          ARCHIVE_ARTIFACT: ${{ inputs.archive_artifact }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_TAG: ${{ inputs.release_tag || 'grokex-v0.149.0' }}
          REQUESTED_VALIDATOR_SHA: ${{ inputs.validator_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archives
          if [[ -n "${ARCHIVE_ARTIFACT}" ]]; then
            [[ -n "${REQUESTED_SOURCE_SHA}" ]]
            source_sha="${REQUESTED_SOURCE_SHA}"
            artifact_name="${ARCHIVE_ARTIFACT}"
          else
            tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REQUESTED_TAG}" --jq .object.type)"
            [[ "${tag_type}" == "commit" ]]
            source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REQUESTED_TAG}" --jq .object.sha)"
            release_target="$(gh release view "${REQUESTED_TAG}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq .targetCommitish)"
            [[ "${release_target}" == "${source_sha}" ]]
            git merge-base --is-ancestor "${source_sha}" "${REQUESTED_VALIDATOR_SHA}"
            gh release download "${REQUESTED_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern 'grokex-v0.149.0-x86_64-unknown-linux-musl.tar.gz' \
              --dir archives
            artifact_name="grokex-published-linux-candidate"
          fi
          python3 grokex/release.py verify-archives \
            --dist archives \
            --source-sha "${source_sha}" \
            --target x86_64-unknown-linux-musl
          {
            echo "artifact_name=${artifact_name}"
            echo "source_sha=${source_sha}"
            echo "validator_sha=${REQUESTED_VALIDATOR_SHA}"
          } >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: inputs.archive_artifact == ''
        with:
          name: grokex-published-linux-candidate
          path: archives
          if-no-files-found: error
          retention-days: 1

  scenarios:
    name: Live ${{ matrix.scenario }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario:
          - basic-exact-reply
          - encrypted-reasoning-tool-continuation
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.validator_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: archives
      - name: Materialize and validate secret profile
        env:
          GROK_CONFIG_TOML: ${{ secrets.GROK_CONFIG_TOML }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GROK_CONFIG_TOML}" ]]
          umask 077
          printf '%s' "${GROK_CONFIG_TOML}" > "${RUNNER_TEMP}/config.toml"
          python3 grokex/release.py verify-profile --path "${RUNNER_TEMP}/config.toml" --secret
      - name: Execute one bounded semantic operation
        env:
          SCENARIO: ${{ matrix.scenario }}
        shell: bash
        run: |
          set -euo pipefail
          python3 grokex/live_smoke.py \
            --archive archives/grokex-v0.149.0-x86_64-unknown-linux-musl.tar.gz \
            --config "${RUNNER_TEMP}/config.toml" \
            --evidence "${RUNNER_TEMP}/LIVE_EVIDENCE-${SCENARIO}.json" \
            --source-sha "${{ needs.prepare.outputs.source_sha }}" \
            --validator-sha "${{ needs.prepare.outputs.validator_sha }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --scenario "${SCENARIO}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: grokex-live-evidence-${{ matrix.scenario }}
          path: ${{ runner.temp }}/LIVE_EVIDENCE-${{ matrix.scenario }}.json
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: Require and bind every Live scenario
    needs: [prepare, scenarios]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.validator_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.scenarios.result == 'success'
        with:
          pattern: grokex-live-evidence-*
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.scenarios.result == 'success'
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: archives
      - name: Build authoritative Live evidence manifest
        if: needs.scenarios.result == 'success'
        run: |
          python3 grokex/release.py build-live-evidence \
            --evidence-dir evidence \
            --archive archives/grokex-v0.149.0-x86_64-unknown-linux-musl.tar.gz \
            --output LIVE_EVIDENCE.json \
            --source-sha "${{ needs.prepare.outputs.source_sha }}" \
            --validator-sha "${{ needs.prepare.outputs.validator_sha }}" \
            --run-id "${GITHUB_RUN_ID}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: needs.scenarios.result == 'success'
        with:
          name: grokex-live-evidence
          path: LIVE_EVIDENCE.json
          if-no-files-found: error
          retention-days: 1
      - name: Require every Live scenario
        env:
          SCENARIOS: ${{ needs.scenarios.result }}
        run: test "${SCENARIOS}" = success
